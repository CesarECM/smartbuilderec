<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi expediente — SmartBuilderEC</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="mi-expediente.css">
</head>
<body>

  <!-- ── Header ── -->
  <header class="dash-header">
    <img src="img/ECM%20blanco%20sin%20fondo.png" alt="SmartBuilderEC">
    <nav class="header-nav" id="headerNav">
      <a href="dashboard">Mis cursos</a>
      <a href="mi-expediente" class="active">Mi expediente</a>
    </nav>
    <div class="header-right">
      <div class="header-avatar" id="headerAvatar"></div>
      <span class="header-nombre" id="headerNombre"></span>
      <button class="header-btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <!-- ── Contenido ── -->
  <main class="exp-main">
    <div class="exp-welcome">
      <h1 id="tituloWelcome">Cargando...</h1>
      <p>Aquí puedes ver tus normas, el estado de tus pagos y el seguimiento de tu certificación CONOCER.</p>
    </div>

    <div id="contenido">
      <!-- Skeletons mientras carga -->
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card" style="opacity:0.6"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script src="mi-expediente.js"></script>
  <script src="soporte/widget-main.js"></script>
  <script src="soporte/widget-ui.js"></script>
  <script src="soporte/widget-chat.js"></script>
  <script src="soporte/widget-tickets.js"></script>
</body>
</html>
