<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi expediente — SmartBuilderEC</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--c-bg); }

    /* ── Header ──────────────────────────────────────────────── */
    .dash-header {
      background: var(--c-blue-700); padding: 0 32px;
      display: flex; align-items: center;
      justify-content: space-between; gap: 16px;
      height: 60px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .dash-header img { max-height: 38px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .header-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.22); color: white;
      font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .header-nombre { color: rgba(255,255,255,0.9); font-size: 14px; font-weight: 500; }
    .header-btn {
      background: rgba(255,255,255,0.14); color: white; border: none;
      padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background var(--t-fast);
    }
    .header-btn:hover { background: rgba(255,255,255,0.26); }
    .header-nav { display: flex; align-items: center; gap: 4px; }
    .header-nav a {
      color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 500;
      text-decoration: none; padding: 5px 10px; border-radius: 6px;
      transition: background var(--t-fast);
    }
    .header-nav a:hover, .header-nav a.active { background: rgba(255,255,255,0.14); color: white; }

    /* ── Layout ──────────────────────────────────────────────── */
    .exp-main { max-width: 860px; margin: 0 auto; padding: 36px 24px 56px; }

    /* ── Welcome ─────────────────────────────────────────────── */
    .exp-welcome { margin-bottom: 32px; }
    .exp-welcome h1 { font-size: 22px; font-weight: 700; color: var(--c-text); margin-bottom: 4px; }
    .exp-welcome p  { color: var(--c-text-2); font-size: 14px; }

    /* ── Estado vacío ────────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 52px 24px;
      background: var(--c-surface); border: 2px dashed var(--c-border);
      border-radius: var(--r-xl);
    }
    .empty-state-icon { font-size: 52px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 17px; font-weight: 700; color: var(--c-text); margin-bottom: 8px; }
    .empty-state p  { color: var(--c-text-3); font-size: 14px; max-width: 400px; margin: 0 auto; }

    /* ── Tarjeta de norma ────────────────────────────────────── */
    .norma-card {
      background: var(--c-surface); border: 1px solid var(--c-border);
      border-radius: var(--r-xl); margin-bottom: 20px;
      overflow: hidden; box-shadow: var(--shadow-xs);
    }

    /* Cabecera de la tarjeta */
    .norma-header {
      background: linear-gradient(135deg, var(--c-blue-700) 0%, var(--c-blue-600) 100%);
      padding: 18px 24px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .norma-header-left { display: flex; flex-direction: column; gap: 2px; }
    .norma-codigo {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: rgba(255,255,255,0.65);
    }
    .norma-nombre {
      font-size: 15px; font-weight: 700; color: #fff; line-height: 1.3;
    }
    .norma-badge-wizard {
      background: rgba(255,255,255,0.18); color: white;
      font-size: 10px; font-weight: 700; padding: 3px 10px;
      border-radius: 99px; white-space: nowrap; flex-shrink: 0;
    }

    /* Cuerpo de la tarjeta */
    .norma-body { padding: 20px 24px; }

    /* Asignaciones de asesor/evaluador */
    .asignados-row {
      display: flex; gap: 20px; margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .asignado-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--c-surface-2); border: 1px solid var(--c-border);
      border-radius: var(--r-md); padding: 8px 14px; flex: 1; min-width: 180px;
    }
    .asignado-icon { font-size: 18px; flex-shrink: 0; }
    .asignado-info { display: flex; flex-direction: column; gap: 1px; }
    .asignado-rol  { font-size: 10px; font-weight: 700; color: var(--c-text-3); text-transform: uppercase; letter-spacing: 0.5px; }
    .asignado-nombre { font-size: 13px; font-weight: 600; color: var(--c-text); }
    .asignado-vacio { font-size: 13px; color: var(--c-text-4); font-style: italic; }

    /* Divisor */
    .norma-divider { border: none; border-top: 1px solid var(--c-border); margin: 16px 0; }

    /* ── Sección: Pagos ──────────────────────────────────────── */
    .seccion-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--c-text-3); margin-bottom: 10px;
    }
    .pagos-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
    .pago-pill {
      display: flex; align-items: center; gap: 7px;
      border-radius: var(--r-md); padding: 8px 14px;
      font-size: 13px; font-weight: 600; flex: 1; min-width: 140px;
      border: 1.5px solid transparent;
    }
    .pago-pill.pagado {
      background: #f0fdf4; border-color: #86efac; color: #166534;
    }
    .pago-pill.pendiente {
      background: var(--c-surface-2); border-color: var(--c-border); color: var(--c-text-3);
    }
    .pago-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .pago-pill.pagado   .pago-dot { background: #22c55e; }
    .pago-pill.pendiente .pago-dot { background: #cbd5e1; }
    .pago-concepto { font-size: 12px; font-weight: 700; text-transform: capitalize; }
    .pago-fecha    { font-size: 10px; font-weight: 400; opacity: 0.75; margin-left: auto; }

    /* ── Sección: Wizard EC0217 ──────────────────────────────── */
    .wizard-barra-wrap { margin-bottom: 4px; }
    .wizard-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--c-text-3); margin-bottom: 6px;
    }
    .wizard-meta strong { color: var(--c-blue-600); }
    .progress-track {
      height: 6px; background: var(--c-border); border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--c-blue-500), var(--c-blue-400));
      transition: width 0.5s ease;
    }
    .progress-fill.completa {
      background: linear-gradient(90deg, #059669, #34d399);
    }
    .btn-ir-wizard {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--c-blue-600); color: white; border: none;
      padding: 8px 16px; border-radius: var(--r-sm);
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; margin-top: 12px; text-decoration: none;
      transition: background var(--t-fast);
    }
    .btn-ir-wizard:hover { background: var(--c-blue-700); }

    /* ── Sección: Timeline certificación ─────────────────────── */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before {
      content: ''; position: absolute; left: 9px; top: 8px;
      width: 2px; bottom: 8px;
      background: var(--c-border);
    }
    .timeline-step { position: relative; margin-bottom: 16px; }
    .timeline-step:last-child { margin-bottom: 0; }
    .timeline-dot {
      position: absolute; left: -24px; top: 3px;
      width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--c-border);
      background: var(--c-surface); z-index: 1; display: flex;
      align-items: center; justify-content: center; font-size: 8px;
    }
    .timeline-step.done   .timeline-dot { background: #22c55e; border-color: #22c55e; }
    .timeline-step.active .timeline-dot { background: var(--c-blue-500); border-color: var(--c-blue-500); animation: pulse-dot 1.8s infinite; }
    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 0 0 rgba(41,82,163,0.4); }
      50%      { box-shadow: 0 0 0 6px rgba(41,82,163,0); }
    }
    .timeline-step-title {
      font-size: 13px; font-weight: 700; color: var(--c-text);
      line-height: 1.2; margin-bottom: 2px;
    }
    .timeline-step.pending .timeline-step-title { color: var(--c-text-4); font-weight: 500; }
    .timeline-step-fecha { font-size: 12px; color: var(--c-text-3); }

    /* Cuenta regresiva */
    .countdown-box {
      display: inline-flex; align-items: center; gap: 8px;
      background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: var(--r-md); padding: 10px 16px;
      margin-top: 12px; flex-wrap: wrap;
    }
    .countdown-box.urgente { background: #fff7ed; border-color: #fed7aa; }
    .countdown-box.listo   { background: #f0fdf4; border-color: #86efac; }
    .countdown-num {
      font-size: 26px; font-weight: 800; color: var(--c-blue-600); line-height: 1;
    }
    .countdown-box.urgente .countdown-num { color: #ea580c; }
    .countdown-box.listo   .countdown-num { color: #16a34a; }
    .countdown-label { font-size: 12px; color: var(--c-text-2); line-height: 1.3; }
    .countdown-label strong { display: block; font-size: 13px; }

    /* ── Skeleton loader ─────────────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e8edf5 25%, #f3f6fb 50%, #e8edf5 75%);
      background-size: 600px 100%; animation: shimmer 1.4s infinite;
      border-radius: var(--r-md);
    }
    .skeleton-card {
      height: 180px; margin-bottom: 20px; border-radius: var(--r-xl);
    }

    /* ── Utilidades ──────────────────────────────────────────── */
    .loading-txt { color: var(--c-text-3); font-size: 14px; padding: 20px 0; }
    .error-box {
      background: var(--c-danger-light); border: 1px solid #fca5a5;
      border-radius: var(--r-md); padding: 14px 18px;
      color: #991b1b; font-size: 14px;
    }

    @media (max-width: 600px) {
      .exp-main { padding: 24px 16px 48px; }
      .norma-body { padding: 16px; }
      .norma-header { padding: 14px 16px; }
      .pagos-row { flex-direction: column; }
      .asignados-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="dash-header">
    <img src="img/LogoECM.png" alt="SmartBuilderEC">
    <nav class="header-nav" id="headerNav">
      <a href="dashboard.html">Mis cursos</a>
      <a href="mi-expediente.html" class="active">Mi expediente</a>
    </nav>
    <div class="header-right">
      <div class="header-avatar" id="headerAvatar"></div>
      <span class="header-nombre" id="headerNombre"></span>
      <button class="header-btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <!-- ── Contenido ── -->
  <main class="exp-main">
    <div class="exp-welcome">
      <h1 id="tituloWelcome">Cargando...</h1>
      <p>Aquí puedes ver tus normas, el estado de tus pagos y el seguimiento de tu certificación CONOCER.</p>
    </div>

    <div id="contenido">
      <!-- Skeletons mientras carga -->
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card" style="opacity:0.6"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    const BACKEND_URL = "https://smartbuilderec.onrender.com";

    // ── Utilidades ────────────────────────────────────────────────────────────
    function iniciales(n, a) {
      return ((n?.[0] || "") + (a?.[0] || "")).toUpperCase() || "U";
    }

    function fmtFecha(iso) {
      if (!iso) return null;
      return new Date(iso).toLocaleDateString("es-MX", { day: "2-digit", month: "long", year: "numeric" });
    }

    function fmtFechaCorta(iso) {
      if (!iso) return null;
      return new Date(iso.includes("T") ? iso : iso + "T12:00:00")
        .toLocaleDateString("es-MX", { day: "2-digit", month: "short", year: "numeric" });
    }

    function calcDiasRestantes(fechaISO) {
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      const meta = new Date(fechaISO.includes("T") ? fechaISO : fechaISO + "T12:00:00");
      return Math.ceil((meta - hoy) / 86400000);
    }

    // ── HTML: tarjeta de norma ────────────────────────────────────────────────
    function renderNormaCard(s, planeaciones) {
      const norma      = s.norma || {};
      const pagos      = s.pagos || {};
      const cert       = s.certificacion || {};
      const asesor     = s.asesor;
      const evaluador  = s.evaluador;

      // Buscar planeación activa de esta norma (solo EC0217.01 por ahora)
      const planeacion = norma.tiene_wizard
        ? (planeaciones[0] || null)
        : null;

      return `
        <div class="norma-card">
          <!-- Cabecera -->
          <div class="norma-header">
            <div class="norma-header-left">
              <span class="norma-codigo">${norma.codigo || ""}</span>
              <span class="norma-nombre">${norma.nombre || ""}</span>
            </div>
            ${norma.tiene_wizard
              ? `<span class="norma-badge-wizard">Con asistente IA</span>`
              : `<span class="norma-badge-wizard" style="background:rgba(255,255,255,0.10);">Presencial</span>`
            }
          </div>

          <div class="norma-body">

            <!-- Asesor / Evaluador -->
            <div class="asignados-row">
              <div class="asignado-chip">
                <span class="asignado-icon">👤</span>
                <div class="asignado-info">
                  <span class="asignado-rol">Asesor</span>
                  ${asesor
                    ? `<span class="asignado-nombre">${[asesor.nombre, asesor.apellido].filter(Boolean).join(" ")}</span>`
                    : `<span class="asignado-vacio">Por asignar</span>`
                  }
                </div>
              </div>
              <div class="asignado-chip">
                <span class="asignado-icon">📋</span>
                <div class="asignado-info">
                  <span class="asignado-rol">Evaluador</span>
                  ${evaluador
                    ? `<span class="asignado-nombre">${[evaluador.nombre, evaluador.apellido].filter(Boolean).join(" ")}</span>`
                    : `<span class="asignado-vacio">Por asignar</span>`
                  }
                </div>
              </div>
            </div>

            <hr class="norma-divider">

            <!-- Pagos -->
            <p class="seccion-label">Pagos</p>
            <div class="pagos-row">
              ${renderPagoPill("Alineación",    pagos.alineacion)}
              ${renderPagoPill("Evaluación",    pagos.evaluacion)}
              ${renderPagoPill("Certificación", pagos.certificacion)}
            </div>

            <!-- Wizard (solo EC0217.01) -->
            ${norma.tiene_wizard ? renderWizardSection(planeacion) : ""}

            <hr class="norma-divider">

            <!-- Proceso CONOCER -->
            <p class="seccion-label">Proceso de certificación CONOCER</p>
            ${renderTimeline(cert)}

          </div>
        </div>`;
    }

    function renderPagoPill(concepto, pago) {
      const pagado = !!pago;
      return `
        <div class="pago-pill ${pagado ? "pagado" : "pendiente"}">
          <span class="pago-dot"></span>
          <span class="pago-concepto">${concepto}</span>
          ${pagado && pago.pagado_at
            ? `<span class="pago-fecha">${fmtFechaCorta(pago.pagado_at)}</span>`
            : (!pagado ? `<span class="pago-fecha">Pendiente</span>` : "")
          }
        </div>`;
    }

    function renderWizardSection(planeacion) {
      if (!planeacion) {
        return `
          <hr class="norma-divider">
          <p class="seccion-label">Asistente de alineación (EC0217.01)</p>
          <div style="display:flex;align-items:center;gap:12px;background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:var(--r-md);padding:12px 16px;">
            <span style="font-size:20px">📋</span>
            <div>
              <div style="font-size:13px;font-weight:600;color:var(--c-text)">No tienes cursos creados aún</div>
              <div style="font-size:12px;color:var(--c-text-3)">Ve a "Mis cursos" para comenzar tu expediente didáctico.</div>
            </div>
            <a href="dashboard.html" class="btn-ir-wizard" style="margin-top:0;flex-shrink:0">Ir al asistente →</a>
          </div>`;
      }

      const paso = planeacion.paso_actual || 1;
      const pct  = Math.round(((paso - 1) / 15) * 100);
      const esCompleta = planeacion.status === "completa";

      return `
        <hr class="norma-divider">
        <p class="seccion-label">Asistente de alineación (EC0217.01)</p>
        <div class="wizard-barra-wrap">
          <div class="wizard-meta">
            <span>${planeacion.nombre_curso || "Mi curso"}</span>
            <strong>${esCompleta ? "Completado" : `Paso ${paso} / 16`}</strong>
          </div>
          <div class="progress-track">
            <div class="progress-fill ${esCompleta ? "completa" : ""}" style="width:${esCompleta ? 100 : pct}%"></div>
          </div>
          <a href="dashboard.html" class="btn-ir-wizard">
            ${esCompleta ? "Ver expediente" : "Continuar asistente"} →
          </a>
        </div>`;
    }

    function renderTimeline(cert) {
      const etapa = cert.etapa || "pendiente";

      const steps = [
        {
          key:     "evaluacion",
          titulo:  "Evaluación realizada",
          done:    !!cert.evaluado_at,
          fecha:   cert.evaluado_at ? fmtFecha(cert.evaluado_at) : null,
          detalle: cert.evaluacion_notas || null,
        },
        {
          key:    "lote",
          titulo: "Lote enviado al CONOCER",
          done:   !!cert.lote_enviado_at,
          fecha:  cert.lote_enviado_at ? fmtFecha(cert.lote_enviado_at) : null,
        },
        {
          key:    "espera",
          titulo: "Certificado en trámite",
          done:   !!cert.certificado_esperado_at,
          fecha:  cert.certificado_esperado_at ? `Esperado el ${fmtFechaCorta(cert.certificado_esperado_at)}` : null,
        },
        {
          key:    "recibido",
          titulo: "Certificado recibido",
          done:   !!cert.certificado_recibido_at,
          fecha:  cert.certificado_recibido_at ? fmtFecha(cert.certificado_recibido_at) : null,
        },
      ];

      // El paso "activo" es el primero que no está done
      let foundActive = false;
      const stepsHtml = steps.map(s => {
        let clase = "pending";
        if (s.done) {
          clase = "done";
        } else if (!foundActive) {
          clase    = "active";
          foundActive = true;
        }

        const iconoDone = `<svg width="8" height="8" viewBox="0 0 10 8" fill="none">
          <path d="M1 4L4 7L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;

        return `
          <div class="timeline-step ${clase}">
            <div class="timeline-dot">${s.done ? iconoDone : ""}</div>
            <div class="timeline-step-title">${s.titulo}</div>
            ${s.fecha ? `<div class="timeline-step-fecha">${s.fecha}</div>` : ""}
            ${s.detalle ? `<div class="timeline-step-fecha" style="margin-top:2px;font-style:italic">"${s.detalle}"</div>` : ""}
          </div>`;
      }).join("");

      // Cuenta regresiva
      let countdownHtml = "";
      if (cert.certificado_recibido_at) {
        countdownHtml = `
          <div class="countdown-box listo" style="margin-top:14px">
            <span style="font-size:28px">🎉</span>
            <div class="countdown-label">
              <strong>¡Certificado recibido!</strong>
              ${fmtFecha(cert.certificado_recibido_at)}
            </div>
          </div>`;
      } else if (cert.certificado_esperado_at) {
        const dias = calcDiasRestantes(cert.certificado_esperado_at);
        if (dias <= 0) {
          countdownHtml = `
            <div class="countdown-box listo" style="margin-top:14px">
              <span style="font-size:22px">📬</span>
              <div class="countdown-label">
                <strong>El certificado debería estar en camino</strong>
                Fecha estimada: ${fmtFechaCorta(cert.certificado_esperado_at)}
              </div>
            </div>`;
        } else {
          const urgente = dias <= 10;
          countdownHtml = `
            <div class="countdown-box ${urgente ? "urgente" : ""}" style="margin-top:14px">
              <div>
                <div class="countdown-num">${dias}</div>
              </div>
              <div class="countdown-label">
                <strong>día${dias !== 1 ? "s" : ""} restante${dias !== 1 ? "s" : ""}</strong>
                para recibir tu certificado CONOCER<br>
                <span style="font-size:11px;opacity:0.75">Fecha estimada: ${fmtFechaCorta(cert.certificado_esperado_at)}</span>
              </div>
            </div>`;
        }
      }

      return `
        <div class="timeline">${stepsHtml}</div>
        ${countdownHtml}`;
    }

    // ── Inicialización ────────────────────────────────────────────────────────
    async function init() {
      const session = await authGuard();
      if (!session) return;

      const perfil = await getUserProfile();
      if (!perfil) { window.location.href = "login.html"; return; }

      // Redirigir si no es alumno
      if (perfil.rol === "super_admin") { window.location.href = "superadmin.html"; return; }
      if (perfil.rol === "admin")       { window.location.href = "admin.html"; return; }

      const nombre = [perfil.nombre, perfil.apellido].filter(Boolean).join(" ") || "usuario";
      document.getElementById("headerAvatar").textContent = iniciales(perfil.nombre, perfil.apellido);
      document.getElementById("headerNombre").textContent = nombre;
      document.getElementById("tituloWelcome").textContent = `Mi expediente, ${perfil.nombre || nombre}`;

      await cargarServicios(perfil);
    }

    async function cargarServicios(perfil) {
      const contenido = document.getElementById("contenido");

      try {
        // Llamada al backend
        const headers = await getAuthHeaders();
        const res  = await fetch(`${BACKEND_URL}/erp/mis-servicios`, { headers });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Error ${res.status}`);
        }

        const data = await res.json();
        const servicios = data.servicios || [];

        if (!servicios.length) {
          contenido.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📄</div>
              <h3>Aún no tienes normas asignadas</h3>
              <p>Tu asesor o administrador te inscribirá en los estándares correspondientes. Mientras tanto puedes usar el asistente de planeación didáctica.</p>
            </div>`;
          return;
        }

        // Cargar planeaciones del alumno para el progreso del wizard
        const { data: planes } = await _supabase
          .from("planeaciones")
          .select("id, nombre_curso, paso_actual, status, updated_at")
          .eq("user_id", perfil.id)
          .order("updated_at", { ascending: false });

        // Renderizar todas las tarjetas
        contenido.innerHTML = servicios
          .map(s => renderNormaCard(s, planes || []))
          .join("");

      } catch (err) {
        console.error("[mi-expediente] Error:", err);
        contenido.innerHTML = `
          <div class="error-box">
            No se pudo cargar tu expediente. Intenta recargar la página.<br>
            <small style="opacity:0.75">${err.message}</small>
          </div>`;
      }
    }

    init();
  </script>
  <script src="soporte-widget.js"></script>
</body>
</html>
