<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — SmartBuilderEC</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--c-bg); }
    .login-container {
      max-width: 440px;
      margin: 40px auto;
      background: var(--c-surface);
      padding: 40px;
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--c-border);
    }
    .login-logo { display: block; margin: 0 auto 18px; max-width: 90px; }
    .login-container h2 {
      color: var(--c-text); font-size: 21px; font-weight: 700;
      text-align: center; margin-bottom: 18px;
    }
    /* Tabs */
    .auth-tabs {
      display: flex; gap: 4px; background: var(--c-surface-2);
      border-radius: var(--r-md); padding: 4px; margin-bottom: 20px;
    }
    .auth-tab {
      flex: 1; padding: 8px; border: none; border-radius: calc(var(--r-md) - 2px);
      background: transparent; color: var(--c-text-2); font-size: 13px;
      font-weight: 600; font-family: inherit; cursor: pointer;
      transition: all var(--t-fast);
    }
    .auth-tab.active {
      background: var(--c-surface); color: var(--c-blue-600);
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }
    /* Campos */
    .login-field { margin-bottom: 14px; }
    .login-field label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--c-text-2); margin-bottom: 5px;
    }
    .login-field input {
      width: 100%; box-sizing: border-box; padding: 10px 13px;
      border: 1.5px solid var(--c-border-s); border-radius: var(--r-md);
      background: var(--c-surface-2); color: var(--c-text);
      font-size: 14px; font-family: inherit; outline: none;
      transition: border-color var(--t-fast);
    }
    .login-field input:focus {
      border-color: var(--c-blue-600);
      box-shadow: 0 0 0 3px rgba(31,59,109,0.12);
    }
    .login-row { display: flex; gap: 10px; }
    .login-row .login-field { flex: 1; }
    /* Descripción de tab */
    .tab-desc {
      font-size: 13px; color: var(--c-text-3); margin-bottom: 16px;
      padding: 10px 12px; background: var(--c-surface-2);
      border-radius: var(--r-sm); border-left: 3px solid var(--c-blue-600);
    }
    /* Código input destacado */
    .codigo-input {
      font-size: 20px !important; font-weight: 700 !important;
      letter-spacing: 4px !important; text-align: center !important;
      text-transform: uppercase !important;
    }
    /* Botón principal */
    .login-btn {
      width: 100%; background: var(--c-blue-600); color: white; border: none;
      padding: 12px; font-size: 15px; font-weight: 600; font-family: inherit;
      border-radius: var(--r-md); cursor: pointer; margin-top: 4px;
      transition: all var(--t-fast); box-shadow: 0 2px 10px rgba(31,59,109,0.22);
    }
    .login-btn:hover:not(:disabled) {
      background: var(--c-blue-700); transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(31,59,109,0.34);
    }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    /* Mensaje */
    .login-msg { text-align: center; font-size: 13px; min-height: 18px; margin-top: 12px; }
    .login-msg.error { color: #c0392b; }
    .login-msg.ok    { color: #27ae60; }
    /* Footer */
    .login-footer { text-align: center; margin-top: 18px; font-size: 13px; color: var(--c-text-3); }
    .login-footer a { color: var(--c-blue-600); font-weight: 600; text-decoration: none; }
    .login-footer a:hover { text-decoration: underline; }
    /* Nota de Stripe */
    .stripe-nota {
      font-size: 12px; color: var(--c-text-3); text-align: center;
      margin-top: 8px; padding: 6px; background: #fffbeb;
      border-radius: var(--r-sm); border: 1px solid #fde68a;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="img/LogoECM.png" alt="Logo CEECM" class="login-logo">
    <h2>Crear cuenta</h2>

    <!-- Selector de método de registro -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabBtnNormal">Registro libre</button>
      <button class="auth-tab" id="tabBtnCodigo">Tengo un código</button>
    </div>

    <!-- ── Tab: Registro estándar ─────────────────────────────────────────── -->
    <div id="tabNormal">
      <p class="tab-desc">
        Crea tu cuenta. El acceso completo se activa mediante suscripción.
      </p>

      <div class="login-row">
        <div class="login-field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Juan" autocomplete="given-name">
        </div>
        <div class="login-field">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" placeholder="Pérez" autocomplete="family-name">
        </div>
      </div>

      <div class="login-field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" autocomplete="email">
      </div>

      <div class="login-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
      </div>

      <div class="login-field">
        <label for="password2">Confirmar contraseña</label>
        <input type="password" id="password2" placeholder="Repite tu contraseña" autocomplete="new-password">
      </div>

      <button class="login-btn" id="btnRegistro">Crear cuenta</button>
      <p class="stripe-nota">La integración de pagos está disponible próximamente.</p>
    </div>

    <!-- ── Tab: Registro con código de acceso ────────────────────────────── -->
    <div id="tabCodigo" style="display:none">
      <p class="tab-desc">
        Tu administrador te generó un código de acceso. Ingrésalo aquí para activar tu cuenta.
      </p>

      <div class="login-field">
        <label for="codigoAcceso">Código de acceso</label>
        <input type="text" id="codigoAcceso" placeholder="XXXX-XXXX"
               class="codigo-input" maxlength="9" autocomplete="off">
      </div>

      <div class="login-row">
        <div class="login-field">
          <label for="cNombre">Nombre</label>
          <input type="text" id="cNombre" placeholder="Juan" autocomplete="given-name">
        </div>
        <div class="login-field">
          <label for="cApellido">Apellido</label>
          <input type="text" id="cApellido" placeholder="Pérez" autocomplete="family-name">
        </div>
      </div>

      <div class="login-field">
        <label for="cEmail">Correo electrónico</label>
        <input type="email" id="cEmail" placeholder="correo@ejemplo.com" autocomplete="email">
      </div>

      <div class="login-field">
        <label for="cPassword">Contraseña</label>
        <input type="password" id="cPassword" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
      </div>

      <div class="login-field">
        <label for="cPassword2">Confirmar contraseña</label>
        <input type="password" id="cPassword2" placeholder="Repite tu contraseña" autocomplete="new-password">
      </div>

      <button class="login-btn" id="btnRegistroCodigo">Activar cuenta con código</button>
    </div>

    <p class="login-msg" id="msg"></p>

    <div class="login-footer">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    const msg = document.getElementById("msg");

    function setMsg(text, type) {
      msg.textContent = text;
      msg.className = "login-msg " + type;
    }

    function validarCampos(nombre, apellido, email, password, password2) {
      if (!nombre || !apellido || !email || !password) return "Completa todos los campos.";
      if (!/\S+@\S+\.\S+/.test(email))                return "Ingresa un correo válido.";
      if (password.length < 8)                         return "La contraseña debe tener al menos 8 caracteres.";
      if (password !== password2)                      return "Las contraseñas no coinciden.";
      return null;
    }

    // ── Tabs ──────────────────────────────────────────────────────────────────
    document.getElementById("tabBtnNormal").addEventListener("click", () => {
      document.getElementById("tabBtnNormal").classList.add("active");
      document.getElementById("tabBtnCodigo").classList.remove("active");
      document.getElementById("tabNormal").style.display = "";
      document.getElementById("tabCodigo").style.display = "none";
      setMsg("", "");
    });

    document.getElementById("tabBtnCodigo").addEventListener("click", () => {
      document.getElementById("tabBtnCodigo").classList.add("active");
      document.getElementById("tabBtnNormal").classList.remove("active");
      document.getElementById("tabCodigo").style.display = "";
      document.getElementById("tabNormal").style.display = "none";
      setMsg("", "");
    });

    // Formato automático del código: insertar guion en posición 4
    document.getElementById("codigoAcceso").addEventListener("input", function () {
      let v = this.value.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (v.length > 4) v = v.slice(0, 4) + "-" + v.slice(4, 8);
      this.value = v;
    });

    // ── Registro estándar ─────────────────────────────────────────────────────
    document.getElementById("btnRegistro").addEventListener("click", async () => {
      const nombre    = document.getElementById("nombre").value.trim();
      const apellido  = document.getElementById("apellido").value.trim();
      const email     = document.getElementById("email").value.trim();
      const password  = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;
      const btn       = document.getElementById("btnRegistro");

      const err = validarCampos(nombre, apellido, email, password, password2);
      if (err) { setMsg(err, "error"); return; }

      btn.disabled = true;
      btn.textContent = "Creando cuenta...";
      setMsg("", "");

      try {
        const { data } = await registro(email, password, nombre, apellido);
        if (data?.session) {
          setMsg("¡Cuenta creada! Redirigiendo...", "ok");
          setTimeout(() => { window.location.href = "dashboard.html"; }, 800);
        } else {
          setMsg("Cuenta creada. Revisa tu correo para confirmarla.", "ok");
          btn.textContent = "Cuenta creada ✓";
        }
      } catch (e) {
        const t = e.message || "";
        if (t.includes("already registered") || t.includes("already been registered")) {
          setMsg("Este correo ya está registrado. ¿Quieres iniciar sesión?", "error");
        } else {
          setMsg("Error al crear la cuenta. Intenta de nuevo.", "error");
        }
        btn.disabled = false;
        btn.textContent = "Crear cuenta";
      }
    });

    // ── Registro con código ───────────────────────────────────────────────────
    document.getElementById("btnRegistroCodigo").addEventListener("click", async () => {
      const codigo    = document.getElementById("codigoAcceso").value.trim();
      const nombre    = document.getElementById("cNombre").value.trim();
      const apellido  = document.getElementById("cApellido").value.trim();
      const email     = document.getElementById("cEmail").value.trim();
      const password  = document.getElementById("cPassword").value;
      const password2 = document.getElementById("cPassword2").value;
      const btn       = document.getElementById("btnRegistroCodigo");

      if (!codigo || codigo.length < 9) { setMsg("Ingresa un código válido (formato XXXX-XXXX).", "error"); return; }

      const err = validarCampos(nombre, apellido, email, password, password2);
      if (err) { setMsg(err, "error"); return; }

      btn.disabled = true;
      btn.textContent = "Verificando código...";
      setMsg("", "");

      try {
        const { data } = await registroConCodigo(email, password, nombre, apellido, codigo);
        if (data?.session) {
          setMsg("¡Cuenta activada! Redirigiendo...", "ok");
          setTimeout(() => { window.location.href = "dashboard.html"; }, 800);
        } else {
          setMsg("Cuenta creada. Revisa tu correo para confirmarla antes de iniciar sesión.", "ok");
          btn.textContent = "Cuenta activada ✓";
        }
      } catch (e) {
        const t = e.message || "";
        if (t.includes("Código inválido") || t.includes("inválido")) {
          setMsg(t, "error");
        } else if (t.includes("INSUFFICIENT_CREDITS")) {
          setMsg("El administrador no tiene créditos disponibles. Contáctalo.", "error");
        } else if (t.includes("already registered")) {
          setMsg("Este correo ya está registrado.", "error");
        } else {
          setMsg("Error al activar la cuenta: " + t, "error");
        }
        btn.disabled = false;
        btn.textContent = "Activar cuenta con código";
      }
    });
  </script>
</body>
</html>
