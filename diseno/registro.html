<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activar cuenta — SmartBuilderEC</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--c-bg); }
    .login-container {
      max-width: 440px;
      margin: 48px auto;
      background: var(--c-surface);
      padding: 40px;
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--c-border);
    }
    .login-logo { display: block; margin: 0 auto 18px; max-width: 82px; }
    .login-container h2 {
      color: var(--c-text); font-size: 20px; font-weight: 700;
      text-align: center; margin-bottom: 6px;
    }
    .login-container .subtitle {
      font-size: 13px; color: var(--c-text-3); text-align: center; margin-bottom: 22px;
    }
    .tab-desc {
      font-size: 13px; color: var(--c-text-3); margin-bottom: 18px;
      padding: 10px 13px; background: var(--c-surface-2);
      border-radius: var(--r-sm); border-left: 3px solid var(--c-blue-600);
      line-height: 1.5;
    }
    .login-field { margin-bottom: 14px; }
    .login-field label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--c-text-2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .login-field input {
      width: 100%; box-sizing: border-box; padding: 10px 13px;
      border: 1.5px solid var(--c-border-s); border-radius: var(--r-md);
      background: var(--c-surface-2); color: var(--c-text);
      font-size: 14px; font-family: inherit; outline: none;
      transition: border-color var(--t-fast);
    }
    .login-field input:focus {
      border-color: var(--c-blue-600);
      box-shadow: 0 0 0 3px rgba(31,59,109,0.10);
    }
    .login-row { display: flex; gap: 10px; }
    .login-row .login-field { flex: 1; }
    .codigo-input {
      font-size: 22px !important; font-weight: 800 !important;
      letter-spacing: 6px !important; text-align: center !important;
      text-transform: uppercase !important;
    }
    .login-btn {
      width: 100%; background: var(--c-blue-600); color: white; border: none;
      padding: 12px; font-size: 15px; font-weight: 600; font-family: inherit;
      border-radius: var(--r-md); cursor: pointer; margin-top: 6px;
      transition: all var(--t-fast); box-shadow: 0 2px 10px rgba(31,59,109,0.22);
    }
    .login-btn:hover:not(:disabled) {
      background: var(--c-blue-700); transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(31,59,109,0.34);
    }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-msg { text-align: center; font-size: 13px; min-height: 18px; margin-top: 12px; }
    .login-msg.error { color: #c0392b; }
    .login-msg.ok    { color: #27ae60; }
    .login-footer { text-align: center; margin-top: 22px; font-size: 13px; color: var(--c-text-3); }
    .login-footer a { color: var(--c-blue-600); font-weight: 600; text-decoration: none; }
    .login-footer a:hover { text-decoration: underline; }
    .divider { border: none; border-top: 1px solid var(--c-border); margin: 20px 0; }
    .link-pago {
      display: block; text-align: center; font-size: 13px; color: var(--c-text-3);
      margin-top: 14px;
    }
    .link-pago a { color: var(--c-blue-600); font-weight: 600; text-decoration: none; }
    .link-pago a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="img/LogoECM.png" alt="Logo CEECM" class="login-logo">
    <h2>Activar cuenta</h2>
    <p class="subtitle">Ingresa el código que te proporcionó tu administrador</p>

    <p class="tab-desc">
      Tu administrador generó un código de acceso personalizado para ti. Ingrésalo aquí junto con tus datos para activar tu cuenta.
    </p>

    <div class="login-field">
      <label for="codigoAcceso">Código de acceso</label>
      <input type="text" id="codigoAcceso" placeholder="XXXX-XXXX"
             class="codigo-input" maxlength="9" autocomplete="off">
    </div>

    <div class="login-row">
      <div class="login-field">
        <label for="cNombre">Nombre</label>
        <input type="text" id="cNombre" placeholder="Juan" autocomplete="given-name">
      </div>
      <div class="login-field">
        <label for="cApellido">Apellido</label>
        <input type="text" id="cApellido" placeholder="Pérez" autocomplete="family-name">
      </div>
    </div>

    <div class="login-field">
      <label for="cEmail">Correo electrónico</label>
      <input type="email" id="cEmail" placeholder="correo@empresa.com" autocomplete="email">
    </div>

    <div class="login-field">
      <label for="cPassword">Contraseña</label>
      <input type="password" id="cPassword" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
    </div>

    <div class="login-field">
      <label for="cPassword2">Confirmar contraseña</label>
      <input type="password" id="cPassword2" placeholder="Repite tu contraseña" autocomplete="new-password">
    </div>

    <button class="login-btn" id="btnActivar">Activar mi cuenta</button>

    <p class="login-msg" id="msg"></p>

    <hr class="divider">

    <div class="login-footer">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </div>
    <p class="link-pago">
      ¿No tienes código? <a href="pago.html">Adquiere tu acceso aquí</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    const msg = document.getElementById("msg");

    function setMsg(text, type) {
      msg.textContent = text;
      msg.className = "login-msg " + (type || "");
    }

    // Formato automático XXXX-XXXX
    document.getElementById("codigoAcceso").addEventListener("input", function () {
      let v = this.value.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (v.length > 4) v = v.slice(0, 4) + "-" + v.slice(4, 8);
      this.value = v;
    });

    document.getElementById("btnActivar").addEventListener("click", async () => {
      const codigo   = document.getElementById("codigoAcceso").value.trim();
      const nombre   = document.getElementById("cNombre").value.trim();
      const apellido = document.getElementById("cApellido").value.trim();
      const email    = document.getElementById("cEmail").value.trim();
      const password  = document.getElementById("cPassword").value;
      const password2 = document.getElementById("cPassword2").value;
      const btn       = document.getElementById("btnActivar");

      if (!codigo || codigo.length < 9) { setMsg("Ingresa un código válido (formato XXXX-XXXX).", "error"); return; }
      if (!nombre || !apellido || !email || !password) { setMsg("Completa todos los campos.", "error"); return; }
      if (!/\S+@\S+\.\S+/.test(email))   { setMsg("Ingresa un correo válido.", "error"); return; }
      if (password.length < 8)           { setMsg("La contraseña debe tener al menos 8 caracteres.", "error"); return; }
      if (password !== password2)        { setMsg("Las contraseñas no coinciden.", "error"); return; }

      btn.disabled = true;
      btn.textContent = "Verificando código...";
      setMsg("", "");

      try {
        const { data } = await registroConCodigo(email, password, nombre, apellido, codigo);
        if (data?.session) {
          setMsg("¡Cuenta activada con éxito! Redirigiendo...", "ok");
          setTimeout(() => { window.location.href = "panel.html"; }, 900);
        } else {
          setMsg("Cuenta creada. Revisa tu correo para confirmarla antes de iniciar sesión.", "ok");
          btn.textContent = "Cuenta activada ✓";
        }
      } catch (e) {
        const t = e.message || "";
        if (t.includes("Código inválido") || t.includes("inválido") || t.includes("expirado")) {
          setMsg(t, "error");
        } else if (t.includes("INSUFFICIENT_CREDITS")) {
          setMsg("El administrador no tiene créditos disponibles. Contáctalo.", "error");
        } else if (t.includes("already registered")) {
          setMsg("Este correo ya está registrado. ¿Ya tienes cuenta?", "error");
        } else {
          setMsg("Error al activar la cuenta: " + t, "error");
        }
        btn.disabled = false;
        btn.textContent = "Activar mi cuenta";
      }
    });
  </script>
<script src="soporte-widget.js"></script>
</body>
</html>
