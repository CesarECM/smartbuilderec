<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento — SmartBuilderEC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0,0,0,0.4);
    }
    .icon {
      font-size: 52px;
      margin-bottom: 24px;
      display: block;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
    }
    .sub {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .time-box {
      background: #0f172a;
      border: 1px solid #f0a500;
      border-radius: 10px;
      padding: 16px 24px;
      margin-bottom: 28px;
    }
    .time-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #f0a500;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .time-value {
      font-size: 26px;
      font-weight: 700;
      color: #fbbf24;
    }
    .contact {
      font-size: 13px;
      color: #64748b;
    }
    .contact a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }
    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🔧</span>
    <h1>Plataforma en mantenimiento</h1>
    <p class="sub">
      Estamos realizando mejoras para ofrecerte una mejor experiencia.
      Por favor, regresa más tarde.
    </p>
    <div class="time-box">
      <div class="time-label">Restauración estimada hoy</div>
      <div class="time-value">8:00 PM</div>
    </div>
    <p class="contact">
      ¿Necesitas ayuda urgente?<br>
      Escríbenos a <a href="mailto:direccion@ceecm.mx">direccion@ceecm.mx</a>
    </p>
  </div>
</body>
</html>
