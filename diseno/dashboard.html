<body>
  <header class="dash-header">
    <a href="catalogo.html"><img src="img/LogoECM.png" alt="CEECM"></a>
    <div class="dash-header-right">
      <span id="headerNombre"></span>
      <a href="catalogo.html">Cursos</a>
      <button onclick="logout()">Salir</button>
    </div>
  </header>

  <main class="dash-main">
    <div class="dash-bienvenida">
      <h1 id="bienvenida">Mi cuenta</h1>
      <p id="subBienvenida"></p>
    </div>
    <div id="contenidoDash">
      <p class="loading">Cargando...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const BACKEND_URL = "https://ceecmweb.onrender.com";

    async function inicializar() {
      const session = await getSession();
      if (!session) { window.location.href = "login.html"; return; }

      const meta = session.user?.user_metadata || {};
      const nombre = meta.nombre ? `${meta.nombre} ${meta.apellido || ""}`.trim() : session.user.email;
      const rol = meta.rol || "estudiante";

      document.getElementById("headerNombre").textContent = nombre;
      document.getElementById("bienvenida").textContent = `Hola, ${meta.nombre || nombre}`;
      document.getElementById("subBienvenida").innerHTML =
        `<span class="rol-badge rol-${rol}">${rol}</span>`;

      if (rol === "admin") {
        renderAdmin();
      } else if (rol === "instructor") {
        renderInstructor();
      } else {
        renderEstudiante();
      }
    }

    // ── Vista Instructor ──────────────────────────────────────────
    async function renderInstructor() {
      const headers = await getAuthHeaders();
      const dash = document.getElementById("contenidoDash");
      dash.innerHTML = `
        <div class="dash-section">
          <h2>Mis planeaciones <a href="index.html">+ Nueva planeación</a></h2>
          <div id="listaPlaneaciones"><p class="loading">Cargando...</p></div>
        </div>
      `;

      try {
        const res = await fetch(`${BACKEND_URL}/planeaciones`, { headers });
        const planeaciones = await res.json();
        const lista = document.getElementById("listaPlaneaciones");

        if (!planeaciones.length) {
          lista.innerHTML = '<p class="dash-empty">Aún no tienes planeaciones guardadas. <a href="index.html">Crear una nueva</a>.</p>';
          return;
        }

        lista.innerHTML = planeaciones.map(p => `
          <div class="planeacion-item">
            <div class="item-info">
              <div class="item-titulo">${p.titulo || "(Sin título)"}</div>
              <div class="item-meta">${new Date(p.created_at).toLocaleDateString("es-MX", { day:"2-digit", month:"short", year:"numeric" })}</div>
            </div>
            <div class="item-actions">
              <button class="btn-sm" onclick="abrirPlaneacion('${p.id}')">Abrir</button>
              <button class="btn-sm danger" onclick="eliminarPlaneacion('${p.id}', this)">Eliminar</button>
            </div>
          </div>
        `).join("");
      } catch (_) {
        document.getElementById("listaPlaneaciones").innerHTML = '<p class="dash-empty">Error al cargar planeaciones.</p>';
      }
    }

    async function abrirPlaneacion(id) {
      const headers = await getAuthHeaders();
      try {
        const res = await fetch(`${BACKEND_URL}/planeaciones/${id}`, { headers });
        const p = await res.json();
        if (p.datos) {
          Object.entries(p.datos).forEach(([key, val]) => {
            if (typeof val === "object") localStorage.setItem(`ec0217_${key}`, JSON.stringify(val));
            else if (val !== null && val !== undefined) localStorage.setItem(`ec0217_${key}`, String(val));
          });
        }
        window.location.href = "index.html";
      } catch (_) {
        alert("Error al cargar la planeación.");
      }
    }

    async function eliminarPlaneacion(id, btn) {
      if (!confirm("¿Eliminar esta planeación?")) return;
      btn.disabled = true;
      const headers = await getAuthHeaders();
      await fetch(`${BACKEND_URL}/planeaciones/${id}`, { method: "DELETE", headers });
      btn.closest(".planeacion-item").remove();
    }

    // ── Vista Estudiante ──────────────────────────────────────────
    async function renderEstudiante() {
      const headers = await getAuthHeaders();
      const dash = document.getElementById("contenidoDash");
      dash.innerHTML = `
        <div class="dash-section">
          <h2>Mis cursos <a href="catalogo.html">Ver catálogo</a></h2>
          <div id="listaCursos"><p class="loading">Cargando...</p></div>
        </div>
      `;

      try {
        const res = await fetch(`${BACKEND_URL}/inscripciones/mias`, { headers });
        const inscripciones = await res.json();
        const lista = document.getElementById("listaCursos");

        if (!inscripciones.length) {
          lista.innerHTML = '<p class="dash-empty">Aún no tienes cursos. <a href="catalogo.html">Explorar catálogo</a>.</p>';
          return;
        }

        lista.innerHTML = inscripciones.map(i => {
          const c = i.cursos || {};
          const fecha = new Date(i.fecha_pago).toLocaleDateString("es-MX", { day:"2-digit", month:"short", year:"numeric" });
          return `
            <div class="curso-item">
              <div class="item-info">
                <div class="item-titulo">${c.titulo || "(Sin nombre)"}</div>
                <div class="item-meta">Inscrito el ${fecha} · ${c.duracion_horas ? c.duracion_horas + "h" : ""}</div>
              </div>
            </div>
          `;
        }).join("");
      } catch (_) {
        document.getElementById("listaCursos").innerHTML = '<p class="dash-empty">Error al cargar cursos.</p>';
      }
    }

    // ── Vista Admin ───────────────────────────────────────────────
    async function renderAdmin() {
      const headers = await getAuthHeaders();
      const dash = document.getElementById("contenidoDash");
      dash.innerHTML = `
        <div class="dash-section">
          <h2>Panel de administración</h2>
          <div class="admin-stats" id="adminStats"><p class="loading">Cargando estadísticas...</p></div>
        </div>
        <div class="dash-section">
          <h2>Gestión de cursos <a href="catalogo.html">Ver catálogo</a></h2>
          <p class="dash-empty">Gestiona los cursos directamente desde el panel de Supabase o desde el Wizard.</p>
        </div>
      `;

      // Cargar estadísticas básicas vía Supabase JS directamente
      try {
        const [perfilesRes, cursosRes, inscrRes] = await Promise.all([
          fetch(`${BACKEND_URL}/perfil`, { headers }), // solo para verificar acceso
          fetch(`${BACKEND_URL}/cursos`),
          fetch(`${BACKEND_URL}/inscripciones/mias`, { headers }),
        ]);
        const cursos = await cursosRes.json();
        document.getElementById("adminStats").innerHTML = `
          <div class="stat-card"><div class="stat-num">${cursos.length}</div><div class="stat-label">Cursos activos</div></div>
        `;
      } catch (_) {
        document.getElementById("adminStats").innerHTML = '<p class="dash-empty">Error al cargar estadísticas.</p>';
      }
    }

    inicializar();
  </script>
</body>
