<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta — SmartBuilderEC</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--c-bg); }

    .dash-header {
      background: var(--c-blue-600);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .dash-header img { max-height: 40px; }
    .dash-header-right { display: flex; align-items: center; gap: 10px; }
    .dash-header-right span { color: rgba(255,255,255,0.9); font-size: 14px; font-weight: 500; }
    .dash-header-right button, .dash-header-right a {
      background: rgba(255,255,255,0.15); color: white; border: none;
      padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer; text-decoration: none;
      transition: background var(--t-fast);
    }
    .dash-header-right button:hover,
    .dash-header-right a:hover { background: rgba(255,255,255,0.28); }

    .dash-main { max-width: 980px; margin: 0 auto; padding: 36px 24px; }

    .dash-welcome { margin-bottom: 32px; }
    .dash-welcome h1 { font-size: 24px; font-weight: 700; color: var(--c-text); margin-bottom: 4px; }
    .dash-welcome p  { color: var(--c-text-2); font-size: 15px; }

    .rol-badge {
      display: inline-block; padding: 2px 10px;
      border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase;
      vertical-align: middle; margin-left: 8px;
    }
    .badge-super_admin { background: #ede9fe; color: #5b21b6; }
    .badge-admin       { background: #fef3c7; color: #92400e; }
    .badge-user        { background: #dbeafe; color: #1e40af; }

    .dash-section { margin-bottom: 36px; }
    .dash-section h2 {
      font-size: 17px; font-weight: 700; color: var(--c-text);
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 2px solid var(--c-border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-section h2 a {
      font-size: 13px; font-weight: 600; color: var(--c-blue-600);
      text-decoration: none;
    }
    .dash-section h2 a:hover { text-decoration: underline; }

    /* Tarjeta de planeación */
    .planeacion-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      transition: box-shadow var(--t-fast);
    }
    .planeacion-card:hover { box-shadow: var(--shadow-sm); }
    .card-info { flex: 1; min-width: 0; }
    .card-titulo {
      font-size: 15px; font-weight: 600; color: var(--c-text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .card-meta { font-size: 12px; color: var(--c-text-3); margin-top: 3px; }
    .card-paso {
      font-size: 11px; font-weight: 700; color: var(--c-blue-600);
      background: #dbeafe; padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
    }
    .card-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn-sm {
      background: var(--c-surface-2); color: var(--c-text-2);
      border: 1px solid var(--c-border-s); padding: 6px 12px;
      border-radius: var(--r-sm); font-size: 12px; font-weight: 600;
      font-family: inherit; cursor: pointer; text-decoration: none;
      transition: all var(--t-fast);
    }
    .btn-sm:hover { background: var(--c-blue-600); color: white; border-color: var(--c-blue-600); }
    .btn-sm.danger:hover { background: #c0392b; color: white; border-color: #c0392b; }

    .btn-nueva {
      background: var(--c-blue-600); color: white; border: none;
      padding: 10px 18px; border-radius: var(--r-md);
      font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
      text-decoration: none; display: inline-block;
      transition: background var(--t-fast);
    }
    .btn-nueva:hover { background: var(--c-blue-700); }

    /* Panel cards de acceso rápido */
    .panel-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .panel-card {
      background: var(--c-surface); border: 1px solid var(--c-border);
      border-radius: var(--r-lg); padding: 22px 20px; text-decoration: none;
      display: block; transition: all var(--t-fast);
    }
    .panel-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .panel-card-icon { font-size: 28px; margin-bottom: 10px; }
    .panel-card-title { font-size: 15px; font-weight: 700; color: var(--c-text); margin-bottom: 4px; }
    .panel-card-desc  { font-size: 13px; color: var(--c-text-2); }

    .loading-txt { color: var(--c-text-3); padding: 20px 0; }
    .empty-txt   { color: var(--c-text-3); font-size: 14px; padding: 20px 0; }
  </style>
</head>
<body>
  <header class="dash-header">
    <img src="img/LogoECM.png" alt="CEECM">
    <div class="dash-header-right">
      <span id="headerNombre"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <main class="dash-main">
    <div class="dash-welcome">
      <h1 id="tituloWelcome">Cargando...</h1>
      <p id="subtituloWelcome"></p>
    </div>
    <div id="contenidoDash">
      <p class="loading-txt">Cargando tu cuenta...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    const BACKEND = "https://smartbuilderec.onrender.com";

    async function init() {
      const session = await authGuard();
      if (!session) return;

      const profile = await getUserProfile();
      if (!profile) { window.location.href = "login.html"; return; }

      const nombreDisplay = [profile.nombre, profile.apellido].filter(Boolean).join(" ") || profile.email;
      document.getElementById("headerNombre").textContent = nombreDisplay;
      document.getElementById("tituloWelcome").innerHTML =
        `Hola, ${profile.nombre || "usuario"} <span class="rol-badge badge-${profile.rol}">${profile.rol.replace("_", " ")}</span>`;

      if (profile.rol === "super_admin") {
        renderSuperAdmin(profile);
      } else if (profile.rol === "admin") {
        renderAdmin(profile);
      } else {
        renderUser(profile);
      }
    }

    // ── Vista Usuario ─────────────────────────────────────────────────────────
    async function renderUser(profile) {
      document.getElementById("subtituloWelcome").textContent = "Gestiona tus cursos en elaboración.";
      const dash = document.getElementById("contenidoDash");
      dash.innerHTML = `
        <div class="dash-section">
          <h2>Mis cursos <a href="index.html?new=1">+ Nuevo curso</a></h2>
          <div id="listaPlaneaciones"><p class="loading-txt">Cargando...</p></div>
        </div>`;

      const headers = await getAuthHeaders();
      try {
        const { data: planeaciones, error } = await _supabase
          .from("planeaciones")
          .select("id, nombre_curso, paso_actual, status, updated_at")
          .eq("user_id", profile.id)
          .order("updated_at", { ascending: false });

        const lista = document.getElementById("listaPlaneaciones");
        if (error || !planeaciones?.length) {
          lista.innerHTML = '<p class="empty-txt">Aún no tienes cursos en elaboración. <a href="index.html?new=1">Crear el primero</a>.</p>';
          return;
        }

        lista.innerHTML = planeaciones.map(p => `
          <div class="planeacion-card">
            <div class="card-info">
              <div class="card-titulo">${p.nombre_curso || "(Sin título)"}</div>
              <div class="card-meta">Última edición: ${new Date(p.updated_at).toLocaleDateString("es-MX", { day:"2-digit", month:"short", year:"numeric" })}</div>
            </div>
            <span class="card-paso">Paso ${p.paso_actual}/16</span>
            <div class="card-actions">
              <button class="btn-sm" onclick="abrirPlaneacion('${p.id}')">Continuar</button>
              <button class="btn-sm danger" onclick="eliminarPlaneacion('${p.id}', this)">Eliminar</button>
            </div>
          </div>`).join("");
      } catch (_) {
        document.getElementById("listaPlaneaciones").innerHTML = '<p class="empty-txt">Error al cargar. Recarga la página.</p>';
      }
    }

    async function abrirPlaneacion(id) {
      const { data: p } = await _supabase.from("planeaciones").select("datos, paso_actual").eq("id", id).single();
      if (!p) { alert("No se pudo cargar el curso."); return; }

      // Volcar datos al localStorage para que el wizard los lea
      if (p.datos && typeof p.datos === "object") {
        Object.entries(p.datos).forEach(([key, val]) => {
          localStorage.setItem(`ec0217_${key}`, typeof val === "string" ? val : JSON.stringify(val));
        });
      }
      localStorage.setItem("sbe_planeacion_id", id);
      window.location.href = "index.html";
    }

    async function eliminarPlaneacion(id, btn) {
      if (!confirm("¿Eliminar este curso? Esta acción no se puede deshacer.")) return;
      btn.disabled = true;
      await _supabase.from("planeaciones").delete().eq("id", id);
      btn.closest(".planeacion-card").remove();
    }

    // ── Vista Admin ───────────────────────────────────────────────────────────
    async function renderAdmin(profile) {
      document.getElementById("subtituloWelcome").textContent =
        `Créditos disponibles: ${profile.credits} usuario${profile.credits !== 1 ? "s" : ""}`;
      document.getElementById("contenidoDash").innerHTML = `
        <div class="dash-section">
          <h2>Panel de administración</h2>
          <div class="panel-cards">
            <a href="admin.html" class="panel-card">
              <div class="panel-card-icon">👥</div>
              <div class="panel-card-title">Mis usuarios</div>
              <div class="panel-card-desc">Gestionar usuarios, créditos y códigos de acceso.</div>
            </a>
            <a href="index.html?new=1" class="panel-card">
              <div class="panel-card-icon">📋</div>
              <div class="panel-card-title">Nueva planeación</div>
              <div class="panel-card-desc">Crear un nuevo expediente didáctico EC0217.</div>
            </a>
          </div>
        </div>`;
    }

    // ── Vista Super Admin ─────────────────────────────────────────────────────
    async function renderSuperAdmin(profile) {
      document.getElementById("subtituloWelcome").textContent = "Panel de control de la plataforma.";
      document.getElementById("contenidoDash").innerHTML = `
        <div class="dash-section">
          <h2>Panel Super Admin</h2>
          <div class="panel-cards">
            <a href="superadmin.html" class="panel-card">
              <div class="panel-card-icon">🛡️</div>
              <div class="panel-card-title">Gestión global</div>
              <div class="panel-card-desc">Administrar admins, créditos y vista global de la plataforma.</div>
            </a>
            <a href="admin.html" class="panel-card">
              <div class="panel-card-icon">👥</div>
              <div class="panel-card-title">Panel Admin</div>
              <div class="panel-card-desc">Gestionar usuarios y códigos de acceso.</div>
            </a>
            <a href="index.html?new=1" class="panel-card">
              <div class="panel-card-icon">📋</div>
              <div class="panel-card-title">Nueva planeación</div>
              <div class="panel-card-desc">Crear un expediente didáctico EC0217.</div>
            </a>
          </div>
        </div>`;
    }

    init();
  </script>
</body>
</html>
