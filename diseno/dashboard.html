<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta — SmartBuilderEC</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--c-bg); }

    /* ── Header ─────────────────────────────────────────────── */
    .dash-header {
      background: var(--c-blue-700);
      padding: 0 32px;
      display: flex; align-items: center;
      justify-content: space-between; gap: 16px;
      height: 60px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .dash-header img { max-height: 38px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .header-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.22); color: white;
      font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .header-nombre { color: rgba(255,255,255,0.9); font-size: 14px; font-weight: 500; }
    .header-btn {
      background: rgba(255,255,255,0.14); color: white; border: none;
      padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer; text-decoration: none;
      transition: background var(--t-fast);
    }
    .header-btn:hover { background: rgba(255,255,255,0.26); }
    .header-nav { display: flex; align-items: center; gap: 6px; margin-right: 4px; }
    .header-nav a {
      color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 500;
      text-decoration: none; padding: 5px 10px; border-radius: 6px;
      transition: background var(--t-fast); white-space: nowrap;
    }
    .header-nav a:hover { background: rgba(255,255,255,0.14); color: white; }
    .btn-continuar {
      background: var(--c-blue-500, #2563eb); color: white; border: none;
      padding: 11px 20px; border-radius: var(--r-md); font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
      transition: background var(--t-fast); box-shadow: var(--shadow-sm); flex-shrink: 0;
    }
    .btn-continuar:hover { background: var(--c-blue-700); }
    .welcome-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* ── Layout principal ────────────────────────────────────── */
    .dash-main { max-width: 1000px; margin: 0 auto; padding: 36px 24px; }

    /* ── Welcome ─────────────────────────────────────────────── */
    .dash-welcome {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 16px;
      margin-bottom: 32px; flex-wrap: wrap;
    }
    .dash-welcome h1 { font-size: 22px; font-weight: 700; color: var(--c-text); margin-bottom: 4px; }
    .dash-welcome p  { color: var(--c-text-2); font-size: 14px; }
    .btn-nuevo {
      background: var(--c-blue-600); color: white; border: none;
      padding: 11px 20px; border-radius: var(--r-md);
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; text-decoration: none; display: inline-flex;
      align-items: center; gap: 8px; white-space: nowrap;
      transition: background var(--t-fast); box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }
    .btn-nuevo:hover { background: var(--c-blue-700); }

    /* ── Badges de rol ───────────────────────────────────────── */
    .rol-badge {
      display: inline-block; padding: 2px 9px;
      border-radius: 20px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; vertical-align: middle; margin-left: 8px;
    }
    .badge-super_admin { background: #ede9fe; color: #5b21b6; }
    .badge-admin       { background: #fef3c7; color: #92400e; }
    .badge-user        { background: #dbeafe; color: #1e40af; }

    /* ── Stats ───────────────────────────────────────────────── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 12px; margin-bottom: 28px; }
    .stat-card {
      background: var(--c-surface); border: 1px solid var(--c-border);
      border-radius: var(--r-lg); padding: 18px 16px;
    }
    .stat-num   { font-size: 28px; font-weight: 800; color: var(--c-blue-600); line-height: 1; }
    .stat-label { font-size: 12px; color: var(--c-text-3); margin-top: 6px; }

    /* ── Sección ─────────────────────────────────────────────── */
    .dash-section { margin-bottom: 36px; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 2px solid var(--c-border);
    }
    .section-header h2 { font-size: 16px; font-weight: 700; color: var(--c-text); margin: 0; }
    .section-header-actions { display: flex; gap: 8px; align-items: center; }

    /* ── Tarjeta de planeación ───────────────────────────────── */
    .planeacion-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      padding: 18px 20px;
      margin-bottom: 10px;
      transition: box-shadow var(--t-fast), border-color var(--t-fast);
    }
    .planeacion-card:hover { box-shadow: var(--shadow-sm); border-color: var(--c-border-s); }

    .card-top { display: flex; align-items: flex-start; gap: 12px; }
    .card-info { flex: 1; min-width: 0; }

    .card-titulo-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .card-titulo {
      font-size: 15px; font-weight: 600; color: var(--c-text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      cursor: text; flex: 1; min-width: 0;
    }
    .card-titulo-input {
      font-size: 15px; font-weight: 600; color: var(--c-text);
      border: 1.5px solid var(--c-blue-600); border-radius: var(--r-sm);
      padding: 2px 8px; font-family: inherit; background: var(--c-surface);
      outline: none; flex: 1; min-width: 0;
      box-shadow: 0 0 0 3px rgba(31,59,109,0.1);
    }

    .card-meta { font-size: 12px; color: var(--c-text-3); }
    .status-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
    }
    .status-borrador { background: #fef3c7; color: #92400e; }
    .status-completa { background: #d1fae5; color: #065f46; }

    /* Barra de progreso del wizard */
    .card-progreso { margin-top: 12px; }
    .card-progreso-info {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--c-text-3); margin-bottom: 5px;
    }
    .card-progreso-wrap {
      height: 5px; background: var(--c-border); border-radius: 99px; overflow: hidden;
    }
    .card-progreso-bar {
      height: 100%; border-radius: 99px;
      transition: width 0.4s ease;
      background: linear-gradient(90deg, var(--c-blue-500), var(--c-blue-400));
    }
    .card-progreso-bar.completa {
      background: linear-gradient(90deg, #059669, #34d399);
    }

    .card-actions {
      display: flex; gap: 8px; flex-shrink: 0; align-items: flex-start;
      margin-left: 8px;
    }
    .btn-sm {
      background: var(--c-surface-2); color: var(--c-text-2);
      border: 1px solid var(--c-border-s); padding: 6px 14px;
      border-radius: var(--r-sm); font-size: 12px; font-weight: 600;
      font-family: inherit; cursor: pointer; white-space: nowrap;
      transition: all var(--t-fast);
    }
    .btn-sm:hover            { background: var(--c-blue-600); color: white; border-color: var(--c-blue-600); }
    .btn-sm.danger:hover     { background: #dc2626; color: white; border-color: #dc2626; }
    .btn-sm.secondary        { background: transparent; border-color: transparent; color: var(--c-text-3); padding: 6px 8px; }
    .btn-sm.secondary:hover  { background: var(--c-surface-2); color: var(--c-text-2); border-color: var(--c-border-s); }

    /* ── Estado vacío ────────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 48px 24px;
      background: var(--c-surface); border: 2px dashed var(--c-border);
      border-radius: var(--r-xl);
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 17px; font-weight: 700; color: var(--c-text); margin-bottom: 8px; }
    .empty-state p  { color: var(--c-text-3); font-size: 14px; margin-bottom: 20px; }

    /* ── Panel cards (admin/superadmin) ──────────────────────── */
    .panel-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .panel-card {
      background: var(--c-surface); border: 1px solid var(--c-border);
      border-radius: var(--r-lg); padding: 22px 20px; text-decoration: none;
      display: block; transition: all var(--t-fast);
    }
    .panel-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--c-border-s); }
    .panel-card-icon  { font-size: 26px; margin-bottom: 10px; }
    .panel-card-title { font-size: 14px; font-weight: 700; color: var(--c-text); margin-bottom: 4px; }
    .panel-card-desc  { font-size: 12px; color: var(--c-text-2); line-height: 1.4; }

    /* ── Importar archivo ────────────────────────────────────── */
    .btn-import {
      background: var(--c-surface-2); color: var(--c-text-2);
      border: 1.5px solid var(--c-border-s); padding: 8px 14px;
      border-radius: var(--r-md); font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer; display: inline-flex;
      align-items: center; gap: 6px; transition: all var(--t-fast);
    }
    .btn-import:hover { border-color: var(--c-blue-600); color: var(--c-blue-600); background: var(--c-surface); }

    /* ── Modal de confirmación ───────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .modal-box {
      background: var(--c-surface); border-radius: var(--r-xl);
      padding: 28px 28px 20px; max-width: 360px; width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .modal-box h3 { font-size: 16px; font-weight: 700; color: var(--c-text); margin-bottom: 8px; }
    .modal-box p  { font-size: 14px; color: var(--c-text-2); margin-bottom: 20px; }
    .modal-btns   { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-btn-cancel { background: var(--c-surface-2); color: var(--c-text-2); border: 1px solid var(--c-border-s); padding: 8px 16px; border-radius: var(--r-sm); font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .modal-btn-ok     { background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: var(--r-sm); font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .modal-btn-ok:hover { background: #b91c1c; }

    .loading-txt { color: var(--c-text-3); padding: 20px 0; font-size: 14px; }
    .error-txt   { color: var(--c-danger); font-size: 14px; padding: 12px 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="dash-header">
    <img src="img/LogoECM.png" alt="CEECM">
    <nav class="header-nav" id="headerNav"></nav>
    <div class="header-right">
      <div class="header-avatar" id="headerAvatar"></div>
      <span class="header-nombre" id="headerNombre"></span>
      <button class="header-btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="dash-main">
    <div class="dash-welcome">
      <div>
        <h1 id="tituloWelcome">Cargando...</h1>
        <p id="subtituloWelcome"></p>
      </div>
      <button class="btn-nuevo" id="btnNuevoCurso" onclick="crearNuevoCurso()">
        + Nuevo curso
      </button>
    </div>

    <div id="contenidoDash">
      <p class="loading-txt">Cargando tu cuenta...</p>
    </div>
  </main>

  <!-- Modal de confirmación para eliminar -->
  <div class="modal-overlay" id="modalEliminar" style="display:none">
    <div class="modal-box">
      <h3>Eliminar curso</h3>
      <p id="modalEliminarTxt">¿Seguro que quieres eliminar este curso? Esta acción no se puede deshacer.</p>
      <div class="modal-btns">
        <button class="modal-btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="modal-btn-ok" id="modalBtnConfirmar">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- Input oculto para importar JSON -->
  <input type="file" id="inputImport" accept=".json" style="display:none">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    // ── Estado global ─────────────────────────────────────────────────────────
    let _perfil = null;
    let _confirmCallback = null;

    // ── Modal de confirmación ─────────────────────────────────────────────────
    function abrirModalEliminar(titulo, onConfirm) {
      document.getElementById("modalEliminarTxt").textContent =
        `¿Seguro que quieres eliminar "${titulo}"? Esta acción no se puede deshacer.`;
      _confirmCallback = onConfirm;
      document.getElementById("modalEliminar").style.display = "flex";
    }
    function cerrarModal() {
      document.getElementById("modalEliminar").style.display = "none";
      _confirmCallback = null;
    }
    document.getElementById("modalBtnConfirmar").addEventListener("click", () => {
      if (_confirmCallback) _confirmCallback();
      cerrarModal();
    });
    document.getElementById("modalEliminar").addEventListener("click", e => {
      if (e.target === document.getElementById("modalEliminar")) cerrarModal();
    });

    // ── Utilidades ────────────────────────────────────────────────────────────
    function iniciales(nombre, apellido) {
      return ((nombre?.[0] || "") + (apellido?.[0] || "")).toUpperCase() || "U";
    }

    function tiempoRelativo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins  = Math.floor(diff / 60000);
      const horas = Math.floor(mins / 60);
      const dias  = Math.floor(horas / 24);
      if (mins  < 2)  return "Ahora mismo";
      if (mins  < 60) return `Hace ${mins} min`;
      if (horas < 24) return `Hace ${horas} h`;
      if (dias  === 1) return "Ayer";
      if (dias  < 7)  return `Hace ${dias} días`;
      return new Date(dateStr).toLocaleDateString("es-MX", { day:"2-digit", month:"short", year:"numeric" });
    }

    function porcentajePaso(paso) {
      return Math.round(((paso - 1) / 15) * 100);
    }

    // ── Inicialización ────────────────────────────────────────────────────────
    async function init() {
      const session = await authGuard();
      if (!session) return;

      _perfil = await getUserProfile();
      if (!_perfil) { window.location.href = "login.html"; return; }

      const nombreDisplay = [_perfil.nombre, _perfil.apellido].filter(Boolean).join(" ") || _perfil.email;
      document.getElementById("headerAvatar").textContent  = iniciales(_perfil.nombre, _perfil.apellido);
      document.getElementById("headerNombre").textContent  = nombreDisplay;
      document.getElementById("tituloWelcome").innerHTML   =
        `Hola, ${_perfil.nombre || "usuario"} <span class="rol-badge badge-${_perfil.rol}">${_perfil.rol.replace("_"," ")}</span>`;

      if (_perfil.rol === "super_admin") {
        document.getElementById("btnNuevoCurso").style.display = "none";
        document.getElementById("headerNav").innerHTML = `
          <a href="superadmin.html">🛡️ Super Admin</a>
          <a href="admin.html">👥 Usuarios</a>
          <a href="index.html?new=1">📋 Nueva planeación</a>`;
        await renderSuperAdmin();
      } else if (_perfil.rol === "admin") {
        document.getElementById("btnNuevoCurso").style.display = "none";
        document.getElementById("headerNav").innerHTML = `
          <a href="admin.html">👥 Mis usuarios</a>
          <a href="index.html?new=1">📋 Nueva planeación</a>`;
        await renderAdmin();
      } else {
        await renderUser();
      }
    }

    // ── Vista: Usuario ────────────────────────────────────────────────────────
    async function renderUser() {
      document.getElementById("subtituloWelcome").textContent = "Gestiona tus cursos en elaboración.";

      // Envolver el botón de nuevo curso en un contenedor de acciones
      const btnNuevo = document.getElementById("btnNuevoCurso");
      const welcomeDiv = btnNuevo.parentElement;
      const wrapper = document.createElement("div");
      wrapper.className = "welcome-actions";
      welcomeDiv.replaceChild(wrapper, btnNuevo);
      wrapper.appendChild(btnNuevo);

      const dash = document.getElementById("contenidoDash");
      dash.innerHTML = `
        <div class="dash-section">
          <div class="section-header">
            <h2>Mis cursos</h2>
            <div class="section-header-actions">
              <button class="btn-import" id="btnImportar">📂 Importar JSON</button>
            </div>
          </div>
          <div id="listaPlaneaciones"><p class="loading-txt">Cargando...</p></div>
        </div>`;

      document.getElementById("btnImportar").addEventListener("click", () => {
        document.getElementById("inputImport").click();
      });

      await cargarPlaneaciones();
    }

    async function cargarPlaneaciones() {
      const lista = document.getElementById("listaPlaneaciones");
      if (!lista) return;

      const { data, error } = await _supabase
        .from("planeaciones")
        .select("id, nombre_curso, paso_actual, status, updated_at, created_at")
        .eq("user_id", _perfil.id)
        .order("updated_at", { ascending: false });

      if (error) {
        lista.innerHTML = '<p class="error-txt">Error al cargar los cursos. Recarga la página.</p>';
        return;
      }

      if (!data?.length) {
        lista.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <h3>Aún no tienes cursos</h3>
            <p>Crea tu primer expediente didáctico EC0217.01 con asistencia de IA.</p>
            <button class="btn-nuevo" onclick="crearNuevoCurso()">+ Crear primer curso</button>
          </div>`;
        return;
      }

      // Actualizar estado del botón según el límite
      const btnNuevo = document.getElementById("btnNuevoCurso");
      if (btnNuevo) {
        const total = data.length;
        const MAX   = 3;
        if (total >= MAX) {
          btnNuevo.disabled    = true;
          btnNuevo.textContent = `Límite alcanzado (${total}/${MAX})`;
          btnNuevo.title       = "Elimina un curso para poder crear otro.";
          btnNuevo.style.opacity = "0.5";
          btnNuevo.style.cursor  = "not-allowed";
        } else {
          btnNuevo.disabled    = false;
          btnNuevo.textContent = `+ Nuevo curso (${total}/${MAX})`;
          btnNuevo.title       = "";
          btnNuevo.style.opacity = "";
          btnNuevo.style.cursor  = "";
        }
      }

      // Botón "Continuar" para el curso más reciente en progreso
      const wrapper = document.querySelector(".welcome-actions");
      if (wrapper) {
        const ultimo = data.find(p => p.status !== "completa");
        const btnContinuar = wrapper.querySelector(".btn-continuar");
        if (btnContinuar) btnContinuar.remove();
        if (ultimo) {
          const btn = document.createElement("button");
          btn.className = "btn-continuar";
          btn.title = ultimo.nombre_curso || "Sin título";
          const label = ultimo.nombre_curso
            ? `Continuar: ${ultimo.nombre_curso.length > 28 ? ultimo.nombre_curso.slice(0, 28) + "…" : ultimo.nombre_curso}`
            : "Continuar último curso";
          btn.textContent = label + " →";
          btn.addEventListener("click", () => abrirPlaneacion(ultimo.id));
          wrapper.insertBefore(btn, wrapper.firstChild);
        }
      }

      lista.innerHTML = data.map(p => {
        const pct     = porcentajePaso(p.paso_actual);
        const tiempo  = tiempoRelativo(p.updated_at);
        const esCompleta = p.status === "completa";
        return `
          <div class="planeacion-card" id="card-${p.id}">
            <div class="card-top">
              <div class="card-info">
                <div class="card-titulo-wrap">
                  <span class="card-titulo" title="${p.nombre_curso || ''}" id="titulo-${p.id}">${p.nombre_curso || "(Sin título)"}</span>
                  <span class="status-badge ${esCompleta ? 'status-completa' : 'status-borrador'}">
                    ${esCompleta ? "Completa" : "Borrador"}
                  </span>
                </div>
                <div class="card-meta">Editado ${tiempo}</div>
              </div>
              <div class="card-actions">
                <button class="btn-sm" onclick="abrirPlaneacion('${p.id}')">
                  ${esCompleta ? "Ver" : "Continuar"}
                </button>
                <button class="btn-sm secondary" onclick="iniciarRenombrar('${p.id}', this)" title="Renombrar">✏️</button>
                <button class="btn-sm danger secondary" onclick="confirmarEliminar('${p.id}', '${(p.nombre_curso||'').replace(/'/g,"\\'")}', this)" title="Eliminar">🗑️</button>
              </div>
            </div>
            <div class="card-progreso">
              <div class="card-progreso-info">
                <span>Paso ${p.paso_actual} de 16</span>
                <span>${pct}%</span>
              </div>
              <div class="card-progreso-wrap">
                <div class="card-progreso-bar ${esCompleta ? 'completa' : ''}" style="width:${pct}%"></div>
              </div>
            </div>
          </div>`;
      }).join("");
    }

    async function abrirPortalFacturacion() {
      try {
        const BACKEND_URL = "https://smartbuilderec.onrender.com";
        const headers = typeof getAuthHeaders === "function" ? await getAuthHeaders() : { "Content-Type": "application/json" };
        const res  = await fetch(`${BACKEND_URL}/billing/portal`, { method: "POST", headers });
        const data = await res.json();
        if (data.portal_url) window.location.href = data.portal_url;
        else alert("No se pudo abrir el portal de facturación.");
      } catch (e) {
        alert("Error al conectar con el servidor.");
      }
    }

    async function abrirPlaneacion(id) {
      const { data: p, error } = await _supabase
        .from("planeaciones")
        .select("datos, paso_actual")
        .eq("id", id)
        .single();

      if (error || !p) { alert("No se pudo cargar el curso."); return; }

      // Precargar datos en localStorage para el wizard
      if (p.datos && typeof p.datos === "object") {
        Object.entries(p.datos).forEach(([key, val]) => {
          localStorage.setItem(`ec0217_${key}`, typeof val === "string" ? val : JSON.stringify(val));
        });
      }
      localStorage.setItem("sbe_planeacion_id", id);
      window.location.href = "index.html";
    }

    // ── Renombrar inline ──────────────────────────────────────────────────────
    function iniciarRenombrar(id, btn) {
      const tituloEl = document.getElementById("titulo-" + id);
      const nombre   = tituloEl.textContent.trim();

      const input = document.createElement("input");
      input.type      = "text";
      input.value     = nombre === "(Sin título)" ? "" : nombre;
      input.className = "card-titulo-input";
      input.placeholder = "Nombre del curso";

      tituloEl.replaceWith(input);
      input.focus();
      input.select();
      btn.style.display = "none";

      async function guardar() {
        const nuevoNombre = input.value.trim() || "Sin título";
        const span = document.createElement("span");
        span.className = "card-titulo";
        span.id        = "titulo-" + id;
        span.title     = nuevoNombre;
        span.textContent = nuevoNombre;
        input.replaceWith(span);
        btn.style.display = "";

        await _supabase.from("planeaciones")
          .update({ nombre_curso: nuevoNombre })
          .eq("id", id);
      }

      input.addEventListener("blur",    guardar);
      input.addEventListener("keydown", e => {
        if (e.key === "Enter")  { e.preventDefault(); guardar(); }
        if (e.key === "Escape") { e.preventDefault(); input.value = nombre; guardar(); }
      });
    }

    // ── Eliminar ──────────────────────────────────────────────────────────────
    function confirmarEliminar(id, nombre, btn) {
      abrirModalEliminar(nombre, async () => {
        btn.disabled = true;
        const { error } = await _supabase.from("planeaciones").delete().eq("id", id);
        if (!error) {
          const card = document.getElementById("card-" + id);
          card.style.opacity = "0";
          card.style.transition = "opacity 0.3s";
          setTimeout(() => {
            card.remove();
            // Si no quedan cursos, recargar lista para mostrar estado vacío
            const lista = document.getElementById("listaPlaneaciones");
            if (lista && !lista.querySelector(".planeacion-card")) cargarPlaneaciones();
          }, 300);
        } else {
          btn.disabled = false;
        }
      });
    }

    // ── Importar JSON ─────────────────────────────────────────────────────────
    document.getElementById("inputImport").addEventListener("change", async function () {
      const file = this.files[0];
      this.value = "";
      if (!file) return;

      try {
        // Verificar límite antes de importar
        const { count } = await _supabase
          .from("planeaciones")
          .select("id", { count: "exact", head: true })
          .eq("user_id", _perfil.id);
        if (count >= 3) {
          alert("Has alcanzado el límite de 3 cursos. Elimina uno para poder importar.");
          return;
        }

        if (!file.name.endsWith(".json")) throw new Error("Solo se aceptan archivos .json");
        const text = await file.text();
        const json = JSON.parse(text);
        if (!json?.datos || typeof json.datos !== "object") throw new Error("Archivo no válido");

        const nombreCurso = json.datos?.nombreCurso || "Importado";

        // Crear nueva planeación con los datos del JSON
        const { data, error } = await _supabase.from("planeaciones").insert({
          user_id:      _perfil.id,
          nombre_curso: nombreCurso,
          datos:        json,
          paso_actual:  1,
        }).select("id").single();

        if (error) throw error;

        // Cargar en localStorage y abrir el wizard
        Object.entries(json).forEach(([key, val]) => {
          if (typeof val !== "undefined") {
            localStorage.setItem(`ec0217_${key}`, typeof val === "string" ? val : JSON.stringify(val));
          }
        });
        localStorage.setItem("ec0217_datos_completo", "true");
        localStorage.setItem("sbe_planeacion_id", data.id);
        window.location.href = "index.html";

      } catch (err) {
        alert("Error al importar: " + err.message);
      }
    });

    // ── Vista: Admin ──────────────────────────────────────────────────────────
    async function renderAdmin() {
      document.getElementById("subtituloWelcome").textContent = "Administra tu plataforma y usuarios.";
      const dash = document.getElementById("contenidoDash");
      dash.innerHTML = `<p class="loading-txt">Cargando estadísticas...</p>`;

      // Consultar usuarios del admin
      const { data: usuarios } = await _supabase
        .from("profiles")
        .select("id, activo")
        .eq("admin_id", _perfil.id);

      const totalUsuarios  = usuarios?.length || 0;
      const creditosUsados = totalUsuarios;
      const creditosTotal  = _perfil.credits + creditosUsados;

      dash.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num">${totalUsuarios}</div>
            <div class="stat-label">Usuarios activos</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${_perfil.credits}</div>
            <div class="stat-label">Créditos disponibles</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${creditosTotal}</div>
            <div class="stat-label">Créditos totales</div>
          </div>
        </div>

        <div class="dash-section">
          <div class="section-header"><h2>Accesos rápidos</h2></div>
          <div class="panel-cards">
            <a href="admin.html" class="panel-card">
              <div class="panel-card-icon">👥</div>
              <div class="panel-card-title">Gestionar usuarios</div>
              <div class="panel-card-desc">Crear y administrar usuarios, generar códigos de acceso y ver mis cursos.</div>
            </a>
            <a href="index.html?new=1" class="panel-card">
              <div class="panel-card-icon">📋</div>
              <div class="panel-card-title">Nueva planeación</div>
              <div class="panel-card-desc">Crear un expediente didáctico EC0217.01 con IA.</div>
            </a>
            ${_perfil.stripe_customer_id ? `
            <div class="panel-card" style="cursor:pointer" onclick="abrirPortalFacturacion()">
              <div class="panel-card-icon">💳</div>
              <div class="panel-card-title">Mi suscripción</div>
              <div class="panel-card-desc">Administrar plan, método de pago y facturación.</div>
            </div>` : ""}
          </div>
        </div>`;
    }

    // ── Vista: Super Admin ────────────────────────────────────────────────────
    async function renderSuperAdmin() {
      document.getElementById("subtituloWelcome").textContent = "Vista global de la plataforma.";
      const dash = document.getElementById("contenidoDash");
      dash.innerHTML = `<p class="loading-txt">Cargando estadísticas...</p>`;

      // Consultar stats globales en paralelo
      const [resAdmins, resUsuarios, resPlaneaciones] = await Promise.all([
        _supabase.from("profiles").select("id", { count: "exact", head: true }).eq("rol", "admin"),
        _supabase.from("profiles").select("id", { count: "exact", head: true }).eq("rol", "user"),
        _supabase.from("planeaciones").select("id", { count: "exact", head: true }),
      ]);

      const totalAdmins      = resAdmins.count      ?? "—";
      const totalUsuarios    = resUsuarios.count     ?? "—";
      const totalPlaneaciones = resPlaneaciones.count ?? "—";

      dash.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num">${totalAdmins}</div>
            <div class="stat-label">Admins activos</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${totalUsuarios}</div>
            <div class="stat-label">Usuarios registrados</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${totalPlaneaciones}</div>
            <div class="stat-label">Planeaciones totales</div>
          </div>
        </div>

        <div class="dash-section">
          <div class="section-header"><h2>Accesos rápidos</h2></div>
          <div class="panel-cards">
            <a href="superadmin.html" class="panel-card">
              <div class="panel-card-icon">🛡️</div>
              <div class="panel-card-title">Panel Super Admin</div>
              <div class="panel-card-desc">Gestionar admins, asignar créditos y ver toda la plataforma.</div>
            </a>
            <a href="admin.html" class="panel-card">
              <div class="panel-card-icon">👥</div>
              <div class="panel-card-title">Panel Admin</div>
              <div class="panel-card-desc">Gestionar usuarios y códigos de acceso.</div>
            </a>
            <a href="index.html?new=1" class="panel-card">
              <div class="panel-card-icon">📋</div>
              <div class="panel-card-title">Nueva planeación</div>
              <div class="panel-card-desc">Crear un expediente didáctico EC0217.01.</div>
            </a>
          </div>
        </div>`;
    }

    // ── Crear nuevo curso (con límite de 3 para rol user) ────────────────────
    async function crearNuevoCurso() {
      if (_perfil.rol !== "user") {
        _limpiarLocalStorage();
        window.location.href = "index.html?new=1";
        return;
      }
      const { count } = await _supabase
        .from("planeaciones")
        .select("id", { count: "exact", head: true })
        .eq("user_id", _perfil.id);
      if (count >= 3) return; // el botón ya está deshabilitado, seguridad adicional
      _limpiarLocalStorage();
      window.location.href = "index.html?new=1";
    }

    function _limpiarLocalStorage() {
      Object.keys(localStorage)
        .filter(k => k.startsWith("ec0217_"))
        .forEach(k => localStorage.removeItem(k));
      localStorage.removeItem("sbe_planeacion_id");
    }

    init();
  </script>
<script src="soporte-widget.js"></script>
</body>
