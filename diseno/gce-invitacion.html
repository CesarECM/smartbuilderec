<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación — SmartBuilderEC</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body { background: var(--c-bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
    .inv-card { background: var(--c-surface); border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,.12); max-width: 480px; width: 100%; overflow: hidden; }
    .inv-header { padding: 24px 28px; }
    .inv-header p { margin: 4px 0 0; font-size: 12px; opacity: .75; }
    .inv-body { padding: 28px; }
    .inv-ce { font-size: 13px; color: var(--c-text-3); margin: 0 0 4px; }
    .inv-titulo { font-size: 20px; font-weight: 700; color: var(--c-text); margin: 0 0 20px; line-height: 1.3; }
    .inv-ecs { margin-bottom: 20px; }
    .inv-ecs p { font-size: 12px; color: var(--c-text-3); margin: 0 0 8px; }
    .norma-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; background: #7c3aed; color: #fff; margin: 0 4px 4px 0; }
    .inv-aviso { font-size: 12px; color: var(--c-text-4); background: var(--c-bg); border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; line-height: 1.5; }
    .inv-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-aceptar { width: 100%; padding: 13px; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-sec { width: 100%; padding: 11px; border: 1.5px solid var(--c-border); border-radius: 8px; font-size: 13px; background: none; color: var(--c-text); cursor: pointer; }
    .inv-footer { font-size: 11px; color: var(--c-text-4); text-align: center; margin-top: 16px; line-height: 1.5; }
    #inv-estado { text-align: center; padding: 32px 28px; }
    #inv-estado h2 { font-size: 17px; color: var(--c-text); margin: 12px 0 8px; }
    #inv-estado p { font-size: 13px; color: var(--c-text-3); margin: 0; }
  </style>
</head>
<body>

  <div class="inv-card" id="inv-card" style="display:none">
    <!-- header coloreado según tipo, inyectado por JS -->
    <div id="inv-header" class="inv-header"></div>
    <div class="inv-body">
      <p class="inv-ce" id="inv-ce"></p>
      <p class="inv-titulo" id="inv-titulo"></p>
      <div class="inv-ecs" id="inv-ecs" style="display:none">
        <p>Estándares de Competencia:</p>
        <div id="inv-ecs-badges"></div>
      </div>
      <div class="inv-aviso" id="inv-aviso"></div>
      <div class="inv-actions" id="inv-actions"></div>
      <p class="inv-footer">Esta invitación es válida por 7 días desde su emisión.</p>
    </div>
  </div>

  <div class="inv-card" id="inv-estado" style="display:none">
    <div id="inv-estado-ico" style="font-size:40px"></div>
    <h2 id="inv-estado-titulo"></h2>
    <p id="inv-estado-msg"></p>
    <a href="panel" style="display:inline-block;margin-top:20px;font-size:13px;color:#7c3aed">← Ir al panel</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const BACKEND = 'https://smartbuilderec.onrender.com';
    const params  = new URLSearchParams(location.search);
    const token   = params.get('token');

    function showEstado(ico, titulo, msg) {
      document.getElementById('inv-estado').style.display = 'block';
      document.getElementById('inv-estado-ico').textContent    = ico;
      document.getElementById('inv-estado-titulo').textContent = titulo;
      document.getElementById('inv-estado-msg').textContent    = msg;
    }

    function renderCard(inv, session) {
      const esCandidato = inv.tipo === 'candidato';
      const color = esCandidato ? '#7c3aed' : '#0f766e';

      document.getElementById('inv-header').style.background = color;
      document.getElementById('inv-header').innerHTML = `
        <p style="margin:0;font-size:17px;font-weight:700;color:#fff">SmartBuilderEC</p>
        <p style="margin:4px 0 0;font-size:12px;color:rgba(255,255,255,.75)">Invitación de evaluación</p>`;

      document.getElementById('inv-ce').textContent    = inv.ce_nombre;
      document.getElementById('inv-titulo').textContent = esCandidato
        ? 'Te invita a certificar tus competencias'
        : 'Te invita a unirte como evaluador';

      if (esCandidato && inv.estandares?.length) {
        document.getElementById('inv-ecs').style.display = 'block';
        document.getElementById('inv-ecs-badges').innerHTML = inv.estandares.map(e =>
          `<span class="norma-badge">${e.codigo}</span>`
        ).join('');
      }

      document.getElementById('inv-aviso').textContent = esCandidato
        ? 'Al aceptar, se creará un proceso de evaluación por cada estándar indicado. Tu Centro de Evaluación cubrirá el costo de los créditos.'
        : 'Al aceptar, quedarás registrado como evaluador y podrás gestionar los procesos de candidatos asignados por tu CE.';

      const actions = document.getElementById('inv-actions');
      if (session) {
        actions.innerHTML = `
          <button class="btn-aceptar" id="btn-aceptar" onclick="aceptar('${session.access_token}')"
            style="background:${color};color:#fff">
            ✓ Aceptar invitación
          </button>`;
      } else {
        const dest = encodeURIComponent(`gce-invitacion?token=${token}`);
        actions.innerHTML = `
          <a href="registro?invitacion=${encodeURIComponent(token)}" style="display:block">
            <button class="btn-aceptar" style="background:${color};color:#fff;width:100%">Crear mi cuenta y aceptar →</button>
          </a>
          <p style="text-align:center;margin:4px 0 0;font-size:12px;color:var(--c-text-4)">
            ¿Ya tienes cuenta? <a href="login?redirect=${dest}" style="color:${color}">Inicia sesión</a>
          </p>`;
      }

      document.getElementById('inv-card').style.display = 'block';
    }

    async function aceptar(accessToken) {
      const btn = document.getElementById('btn-aceptar');
      btn.disabled = true; btn.textContent = 'Procesando...';
      try {
        const r = await fetch(`${BACKEND}/gce/invitaciones/aceptar`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.detail || `Error ${r.status}`);
        }
        const d = await r.json();
        document.getElementById('inv-card').style.display = 'none';
        showEstado('✅', '¡Invitación aceptada!',
          d.tipo === 'candidato'
            ? 'Tu proceso de evaluación ha sido creado. En un momento te llevamos a tu panel…'
            : 'Ahora formas parte del equipo como evaluador. En un momento te llevamos a tu panel…');
        setTimeout(() => { window.location.href = 'panel'; }, 2500);
      } catch (e) {
        btn.disabled = false; btn.textContent = '✓ Aceptar invitación';
        alert('Error: ' + e.message);
      }
    }

    async function init() {
      if (!token) { showEstado('⚠️', 'Enlace inválido', 'Este enlace no contiene un token de invitación.'); return; }

      let inv;
      try {
        const r = await fetch(`${BACKEND}/gce/invitaciones/verificar?token=${encodeURIComponent(token)}`);
        inv = await r.json();
      } catch {
        showEstado('🔌', 'Sin conexión', 'No se pudo conectar al servidor. Espera un momento y recarga.'); return;
      }

      if (inv.estado === 'expirada') { showEstado('⏰', 'Invitación expirada', 'Este enlace ya no es válido. Solicita una nueva invitación a tu Centro de Evaluación.'); return; }
      if (inv.estado === 'aceptada') { showEstado('✅', 'Ya aceptada', 'Esta invitación ya fue procesada anteriormente.'); return; }
      if (!inv.tipo)                 { showEstado('❌', 'No encontrada', 'No existe ninguna invitación con este enlace.'); return; }

      const { data: { session } } = await _supabase.auth.getSession();
      renderCard(inv, session);
    }

    init();
  </script>
</body>
</html>
