<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña — SmartBuilderEC</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--c-bg); }
    .login-container {
      max-width: 400px;
      margin: 80px auto;
      background: var(--c-surface);
      padding: 44px 40px;
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--c-border);
    }
    .login-logo { display: block; margin: 0 auto 20px; max-width: 90px; }
    .login-container h2 {
      color: var(--c-text); font-size: 21px; font-weight: 700;
      text-align: center; margin-bottom: 8px;
    }
    .login-container p.subtitulo {
      text-align: center; color: var(--c-text-3); font-size: 13px; margin-bottom: 24px;
    }
    .login-field { margin-bottom: 16px; }
    .login-field label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--c-text-2); margin-bottom: 6px;
    }
    .login-field input {
      width: 100%; box-sizing: border-box; padding: 11px 14px;
      border: 1.5px solid var(--c-border-s); border-radius: var(--r-md);
      background: var(--c-surface-2); color: var(--c-text);
      font-size: 15px; font-family: inherit; outline: none;
      transition: border-color var(--t-fast);
    }
    .login-field input:focus {
      border-color: var(--c-blue-600);
      box-shadow: 0 0 0 3px rgba(31,59,109,0.12);
    }
    .login-btn {
      width: 100%; background: var(--c-blue-600); color: white; border: none;
      padding: 13px; font-size: 15px; font-weight: 600; font-family: inherit;
      border-radius: var(--r-md); cursor: pointer; margin-top: 4px;
      transition: all var(--t-fast); box-shadow: 0 2px 10px rgba(31,59,109,0.22);
    }
    .login-btn:hover:not(:disabled) {
      background: var(--c-blue-700); transform: translateY(-1px);
    }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-msg { text-align: center; font-size: 13px; min-height: 18px; margin-top: 12px; }
    .login-msg.error { color: #c0392b; }
    .login-msg.ok    { color: #27ae60; }
    .estado-cargando {
      text-align: center; color: var(--c-text-3);
      font-size: 14px; padding: 20px 0;
    }
    .login-footer { text-align: center; margin-top: 18px; font-size: 13px; color: var(--c-text-3); }
    .login-footer a { color: var(--c-blue-600); font-weight: 600; text-decoration: none; }

    /* Barra de fortaleza */
    .strength-bar-wrap {
      height: 6px; background: var(--c-border); border-radius: 99px;
      margin: 8px 0 4px; overflow: hidden;
    }
    .strength-bar {
      height: 100%; width: 0%; border-radius: 99px;
      transition: width 0.3s ease, background 0.3s ease;
    }
    .strength-label {
      font-size: 11px; font-weight: 700; text-align: right;
      margin-bottom: 10px; min-height: 14px;
    }
    /* Requisitos */
    .req-lista {
      list-style: none; margin: 0 0 16px; padding: 0;
      background: var(--c-surface-2); border-radius: var(--r-md);
      padding: 10px 14px;
    }
    .req-lista li {
      font-size: 12px; color: var(--c-text-3);
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; transition: color 0.2s;
    }
    .req-lista li.ok { color: var(--c-success); }
    .req-lista li::before { content: "○"; font-size: 11px; flex-shrink: 0; }
    .req-lista li.ok::before { content: "✓"; }
    /* Match de confirmación */
    .match-hint {
      font-size: 12px; margin-top: -10px; margin-bottom: 12px;
      min-height: 16px;
    }
    .match-hint.ok    { color: var(--c-success); }
    .match-hint.error { color: var(--c-danger); }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="img/LogoECM.png" alt="Logo CEECM" class="login-logo">
    <h2>Nueva contraseña</h2>
    <p class="subtitulo">Elige una contraseña segura para tu cuenta.</p>

    <!-- Estado mientras se verifica el token del enlace -->
    <div id="estadoCargando" class="estado-cargando">Verificando enlace...</div>

    <!-- Formulario (se muestra solo cuando el token es válido) -->
    <div id="formReset" style="display:none">

      <div class="login-field">
        <label for="password">Nueva contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
        <!-- Barra de fortaleza -->
        <div class="strength-bar-wrap"><div class="strength-bar" id="strengthBar"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <!-- Requisitos en tiempo real -->
      <ul class="req-lista" id="reqLista">
        <li id="req-len">Al menos 8 caracteres</li>
        <li id="req-upper">Una letra mayúscula (A-Z)</li>
        <li id="req-num">Un número (0-9)</li>
        <li id="req-special">Un carácter especial (!@#$%...)</li>
      </ul>

      <div class="login-field">
        <label for="password2">Confirmar contraseña</label>
        <input type="password" id="password2" placeholder="Repite la contraseña" autocomplete="new-password">
      </div>
      <p class="match-hint" id="matchHint"></p>

      <button class="login-btn" id="btnReset" disabled>Guardar contraseña</button>
    </div>

    <!-- Error si el enlace es inválido -->
    <div id="estadoError" style="display:none" class="estado-cargando">
      Este enlace no es válido o ya expiró.<br>
      <a href="login.html" style="color:var(--c-blue-600)">Solicitar uno nuevo</a>
    </div>

    <p class="login-msg" id="msg"></p>

    <div class="login-footer">
      <a href="login.html">← Volver al inicio de sesión</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    const msg = document.getElementById("msg");

    function setMsg(text, type) {
      msg.textContent = text;
      msg.className = "login-msg " + type;
    }

    function mostrarFormulario() {
      document.getElementById("estadoCargando").style.display = "none";
      document.getElementById("formReset").style.display = "";
    }

    function mostrarError() {
      document.getElementById("estadoCargando").style.display = "none";
      document.getElementById("estadoError").style.display = "";
    }

    // Supabase detecta el token del enlace de recuperación en la URL automáticamente
    // (gracias a detectSessionInUrl: true en supabase-client.js)
    // El evento PASSWORD_RECOVERY indica que el token es válido.
    _supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        mostrarFormulario();
      } else if (event === "SIGNED_IN" && session) {
        // Si ya hay sesión activa sin recovery, redirigir al dashboard
        window.location.href = "dashboard.html";
      }
    });

    // Timeout: si en 4 segundos no llega el evento, el enlace es inválido
    setTimeout(() => {
      if (document.getElementById("estadoCargando").style.display !== "none") {
        mostrarError();
      }
    }, 4000);

    // ── Validación en tiempo real ─────────────────────────────────────────────
    const REGLAS = [
      { id: "req-len",     test: p => p.length >= 8 },
      { id: "req-upper",   test: p => /[A-Z]/.test(p) },
      { id: "req-num",     test: p => /[0-9]/.test(p) },
      { id: "req-special", test: p => /[^A-Za-z0-9]/.test(p) },
    ];

    const COLORES = ["", "#e74c3c", "#e67e22", "#f1c40f", "#27ae60"];
    const ETIQUETAS = ["", "Muy débil", "Débil", "Aceptable", "Segura"];

    function evaluarFortaleza(password) {
      return REGLAS.filter(r => r.test(password)).length;
    }

    function actualizarUI() {
      const pw  = document.getElementById("password").value;
      const pw2 = document.getElementById("password2").value;
      const puntaje = evaluarFortaleza(pw);

      // Requisitos
      REGLAS.forEach(r => {
        const li = document.getElementById(r.id);
        li.classList.toggle("ok", r.test(pw));
      });

      // Barra de fortaleza
      const bar   = document.getElementById("strengthBar");
      const label = document.getElementById("strengthLabel");
      bar.style.width      = pw ? (puntaje * 25) + "%" : "0%";
      bar.style.background = pw ? COLORES[puntaje] : "";
      label.textContent    = pw ? ETIQUETAS[puntaje] : "";
      label.style.color    = pw ? COLORES[puntaje] : "";

      // Coincidencia de confirmación
      const hint = document.getElementById("matchHint");
      if (!pw2) {
        hint.textContent = "";
        hint.className = "match-hint";
      } else if (pw === pw2) {
        hint.textContent = "✓ Las contraseñas coinciden";
        hint.className = "match-hint ok";
      } else {
        hint.textContent = "✗ Las contraseñas no coinciden";
        hint.className = "match-hint error";
      }

      // Habilitar botón solo si todo está OK
      const todo = puntaje === 4 && pw === pw2 && pw2.length > 0;
      document.getElementById("btnReset").disabled = !todo;
    }

    document.getElementById("password").addEventListener("input", actualizarUI);
    document.getElementById("password2").addEventListener("input", actualizarUI);

    // ── Guardar nueva contraseña ──────────────────────────────────────────────
    document.getElementById("btnReset").addEventListener("click", async () => {
      const password = document.getElementById("password").value;
      const btn      = document.getElementById("btnReset");

      btn.disabled = true;
      btn.textContent = "Guardando...";
      setMsg("", "");

      const { error } = await _supabase.auth.updateUser({ password });

      if (error) {
        setMsg("Error al actualizar: " + error.message, "error");
        btn.disabled = false;
        btn.textContent = "Guardar contraseña";
        return;
      }

      setMsg("¡Contraseña actualizada correctamente! Redirigiendo...", "ok");
      btn.textContent = "Guardado ✓";
      setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
    });
  </script>
<script src="soporte-widget.js"></script>
</body>
</html>
