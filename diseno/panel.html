<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Panel — SmartBuilderEC</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="panel-tables.css">
  <link rel="stylesheet" href="panel-sa.css">
  <link rel="stylesheet" href="panel-sa-modules.css">
</head>
<body>

  <!-- ── Header ───────────────────────────────────────────────── -->
  <header class="panel-header">
    <img src="img/ECM%20blanco%20sin%20fondo.png" alt="CEECM" id="headerLogo">
    <span class="header-title" id="headerTitle">SmartBuilderEC</span>
    <nav class="role-switcher" id="roleSwitcher"></nav>
    <div class="header-right">
      <span class="header-nombre" id="headerNombre"></span>
      <!-- Campana de notificaciones GCE -->
      <div style="position:relative;display:inline-block;margin-right:4px">
        <button onclick="toggleNotifPanel()" id="notif-btn"
          style="background:none;border:none;cursor:pointer;font-size:18px;padding:4px 6px;color:#fff;line-height:1;vertical-align:middle">
          🔔
        </button>
        <span id="notif-badge"
          style="display:none;position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;
                 background:#ef4444;color:#fff;border-radius:9px;font-size:10px;font-weight:700;
                 align-items:center;justify-content:center;padding:0 3px">
          0
        </span>
        <div id="notif-panel"
          style="display:none;position:absolute;right:0;top:38px;width:320px;max-height:460px;
                 overflow-y:auto;background:#fff;border-radius:12px;
                 box-shadow:0 8px 32px rgba(0,0,0,.18);border:1px solid #e5e7eb;z-index:3000">
          <div style="padding:12px 16px;border-bottom:1px solid #e5e7eb;font-weight:700;font-size:13px;color:#374151">
            Notificaciones
          </div>
          <div id="notif-panel-body" style="padding:8px"></div>
        </div>
      </div>
      <button class="header-btn" onclick="logout()">Salir</button>
    </div>
  </header>

  <!-- ── Contenido por rol (llenado por tpl-*.js) ─────────────── -->
  <main class="panel-main">
    <div id="rp-alumno"      class="role-panel"></div>
    <div id="rp-asesor"      class="role-panel"></div>
    <div id="rp-evaluador"   class="role-panel"></div>
    <div id="rp-ce_admin"    class="role-panel"></div>
    <div id="rp-oc_admin"    class="role-panel"></div>
    <div id="rp-admin"       class="role-panel"></div>
    <div id="rp-super_admin" class="role-panel"></div>
  </main>

  <div class="toast" id="toast"></div>
  <div id="panel-modals-adm"></div>
  <div id="panel-modals-sa"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script src="shared/debug-panel.js"></script>

  <!-- ── Templates HTML (inyectan el DOM antes que los scripts funcionales) -->
  <script src="panel/tpl-alumno.js"></script>
  <script src="panel/tpl-admin.js"></script>
  <script src="panel/tpl-branding.js"></script>
  <script src="panel/tpl-sa-outer.js"></script>
  <script src="panel/tpl-sa-resumen.js"></script>
  <script src="panel/tpl-sa-usuarios.js"></script>
  <script src="panel/tpl-sa-plataforma.js"></script>
  <script src="panel/tpl-sa-config.js"></script>
  <script src="panel/tpl-sa-soporte.js"></script>
  <script src="panel/tpl-sa-logs.js"></script>
  <script src="panel/tpl-plan.js"></script>
  <script src="panel/tpl-gce.js"></script>
  <script src="panel/tpl-gce-oc.js"></script>
  <script src="panel/tpl-modals-adm.js"></script>
  <script src="panel/tpl-modals-sa.js"></script>

  <!-- ── Módulos funcionales del panel ────────────────────────── -->
  <script src="panel/panel-shared.js"></script>
  <script src="panel/panel-alumno.js"></script>
  <script src="panel/panel-alumno-normas.js"></script>
  <script src="panel/panel-alumno-normas-ec1375.js"></script>
  <script src="panel/panel-roles.js"></script>
  <script src="panel/panel-admin-usuarios.js"></script>
  <script src="panel/panel-branding.js"></script>
  <script src="panel/panel-admin-plan.js"></script>
  <script src="panel/panel-admin-codigos.js"></script>
  <script src="panel/panel-admin-planeaciones.js"></script>
  <script src="panel/panel-sa-init.js"></script>
  <script src="panel/panel-sa-vigencias.js"></script>
  <script src="panel/panel-sa-integraciones.js"></script>
  <script src="panel/panel-sa-usuarios.js"></script>
  <script src="panel/panel-sa-plataforma.js"></script>
  <script src="panel/panel-sa-tabla.js"></script>
  <script src="panel/panel-sa-roles.js"></script>
  <script src="panel/panel-sa-templates.js"></script>
  <script src="panel/panel-sa-logs.js"></script>
  <script src="panel/panel-sa-tickets.js"></script>
  <script src="panel/panel-sa-kb.js"></script>
  <script src="panel/panel-sa-sugerencias.js"></script>
  <script src="panel/panel-gce.js"></script>
  <script src="panel/panel-gce-invitaciones.js"></script>
  <script src="panel/panel-gce-equipo.js"></script>
  <script src="panel/panel-gce-oc.js"></script>
  <script src="panel/branding-engine.js"></script>
  <script src="panel/panel-notificaciones.js"></script>
  <script src="panel/panel-main.js"></script>
  <script src="soporte/widget-main.js"></script>
  <script src="soporte/widget-ui.js"></script>
  <script src="soporte/widget-chat.js"></script>
  <script src="soporte/widget-tickets.js"></script>

</body>
</html>
