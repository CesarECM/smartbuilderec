<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — SmartBuilderEC</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--c-bg); }
    .login-container {
      max-width: 420px;
      margin: 60px auto;
      background: var(--c-surface);
      padding: 44px 40px;
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--c-border);
    }
    .login-logo { display: block; margin: 0 auto 20px; max-width: 100px; }
    .login-container h2 {
      color: var(--c-text); font-size: 22px; font-weight: 700;
      text-align: center; margin-bottom: 20px;
    }
    /* Tabs */
    .auth-tabs {
      display: flex; gap: 4px; background: var(--c-surface-2);
      border-radius: var(--r-md); padding: 4px; margin-bottom: 20px;
    }
    .auth-tab {
      flex: 1; padding: 8px; border: none; border-radius: calc(var(--r-md) - 2px);
      background: transparent; color: var(--c-text-2); font-size: 13px;
      font-weight: 600; font-family: inherit; cursor: pointer;
      transition: all var(--t-fast);
    }
    .auth-tab.active {
      background: var(--c-surface); color: var(--c-blue-600);
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }
    /* Campos */
    .login-field { margin-bottom: 16px; }
    .login-field label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--c-text-2); margin-bottom: 6px;
    }
    .login-field input {
      width: 100%; box-sizing: border-box; padding: 11px 14px;
      border: 1.5px solid var(--c-border-s); border-radius: var(--r-md);
      background: var(--c-surface-2); color: var(--c-text);
      font-size: 15px; font-family: inherit; outline: none;
      transition: border-color var(--t-fast);
    }
    .login-field input:focus {
      border-color: var(--c-blue-600);
      box-shadow: 0 0 0 3px rgba(31,59,109,0.12);
    }
    /* Botón principal */
    .login-btn {
      width: 100%; background: var(--c-blue-600); color: white; border: none;
      padding: 13px; font-size: 15px; font-weight: 600; font-family: inherit;
      border-radius: var(--r-md); cursor: pointer; margin-top: 4px;
      transition: all var(--t-fast); box-shadow: 0 2px 10px rgba(31,59,109,0.22);
    }
    .login-btn:hover:not(:disabled) {
      background: var(--c-blue-700); transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(31,59,109,0.34);
    }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    /* Magic link hint */
    .magic-hint {
      font-size: 13px; color: var(--c-text-3); margin-bottom: 12px; text-align: center;
    }
    /* Divider "o" */
    .divider-or {
      display: flex; align-items: center; gap: 12px;
      margin: 18px 0; color: var(--c-text-3); font-size: 13px;
    }
    .divider-or::before, .divider-or::after {
      content: ""; flex: 1; height: 1px; background: var(--c-border);
    }
    /* Botón Google */
    .btn-google {
      width: 100%; background: var(--c-surface); color: var(--c-text);
      border: 1.5px solid var(--c-border-s); padding: 11px 14px;
      border-radius: var(--r-md); font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 10px; transition: all var(--t-fast);
    }
    .btn-google:hover {
      background: var(--c-surface-2); border-color: var(--c-blue-600);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    /* Mensaje de estado */
    .login-msg {
      text-align: center; font-size: 13px; min-height: 18px; margin-top: 12px;
    }
    .login-msg.error { color: #c0392b; }
    .login-msg.ok    { color: #27ae60; }
    /* Footer */
    .login-footer {
      text-align: center; margin-top: 20px; font-size: 13px; color: var(--c-text-3);
    }
    .login-footer a { color: var(--c-blue-600); font-weight: 600; text-decoration: none; }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="img/LogoECM.png" alt="Logo CEECM" class="login-logo">
    <h2>Iniciar Sesión</h2>

    <!-- Selector de método -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabBtnPassword">Contraseña</button>
      <button class="auth-tab" id="tabBtnMagic">Magic Link</button>
    </div>

    <!-- Formulario: email + contraseña -->
    <div id="formPassword">
      <div class="login-field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" autocomplete="email">
      </div>
      <div class="login-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="login-btn" id="btnLogin">Entrar</button>
      <p style="text-align:center;margin-top:12px;font-size:13px;">
        <a href="#" id="btnForgot" style="color:var(--c-blue-600);text-decoration:none;font-weight:600;">¿Olvidaste tu contraseña?</a>
      </p>
    </div>

    <!-- Formulario: recuperar contraseña -->
    <div id="formForgot" style="display:none">
      <div class="login-field">
        <label for="forgotEmail">Correo electrónico</label>
        <input type="email" id="forgotEmail" placeholder="correo@ejemplo.com" autocomplete="email">
      </div>
      <p class="magic-hint">Te enviaremos un enlace para establecer una nueva contraseña.</p>
      <button class="login-btn" id="btnSendReset">Enviar enlace de recuperación</button>
      <p style="text-align:center;margin-top:12px;font-size:13px;">
        <a href="#" id="btnBackLogin" style="color:var(--c-blue-600);text-decoration:none;">← Volver al inicio de sesión</a>
      </p>
    </div>

    <!-- Formulario: magic link (sin contraseña) -->
    <div id="formMagic" style="display:none">
      <div class="login-field">
        <label for="magicEmail">Correo electrónico</label>
        <input type="email" id="magicEmail" placeholder="correo@ejemplo.com" autocomplete="email">
      </div>
      <p class="magic-hint">Recibirás un enlace para entrar sin necesidad de contraseña.</p>
      <button class="login-btn" id="btnMagic">Enviar enlace mágico</button>
    </div>

    <p class="login-msg" id="msg"></p>

    <!-- Google OAuth -->
    <div class="divider-or"><span>o</span></div>
    <button class="btn-google" id="btnGoogle">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908C16.658 14.253 17.64 11.945 17.64 9.2z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      Continuar con Google
    </button>

    <div class="login-footer">
      ¿No tienes cuenta? <a href="registro">Regístrate aquí</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    const BACKEND_URL = "https://smartbuilderec.onrender.com";

    function _panelPorRol(rol) {
      return "panel";
    }

    // Redirigir si ya hay sesión activa
    (async () => {
      const session = await getSession();
      if (session) {
        const perfil = await getUserProfile();
        window.location.href = _panelPorRol(perfil?.rol);
      }
    })();

    const msg = document.getElementById("msg");

    function setMsg(text, type) {
      msg.textContent = text;
      msg.className = "login-msg " + type;
    }

    // ── Tabs ──────────────────────────────────────────────────────────────────
    document.getElementById("tabBtnPassword").addEventListener("click", () => {
      document.getElementById("tabBtnPassword").classList.add("active");
      document.getElementById("tabBtnMagic").classList.remove("active");
      document.getElementById("formPassword").style.display = "";
      document.getElementById("formMagic").style.display = "none";
      setMsg("", "");
    });

    document.getElementById("tabBtnMagic").addEventListener("click", () => {
      document.getElementById("tabBtnMagic").classList.add("active");
      document.getElementById("tabBtnPassword").classList.remove("active");
      document.getElementById("formMagic").style.display = "";
      document.getElementById("formPassword").style.display = "none";
      setMsg("", "");
    });

    // ── Login email + contraseña ──────────────────────────────────────────────
    document.getElementById("password").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("btnLogin").click();
    });

    document.getElementById("btnLogin").addEventListener("click", async () => {
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn      = document.getElementById("btnLogin");

      if (!email || !password) { setMsg("Ingresa tu correo y contraseña.", "error"); return; }

      btn.disabled = true;
      btn.textContent = "Ingresando...";
      setMsg("", "");

      try {
        await login(email, password);
        setMsg("Sesión iniciada. Redirigiendo...", "ok");
        const perfil = await getUserProfile();
        window.location.href = _panelPorRol(perfil?.rol);
      } catch (err) {
        const t = err.message || "";
        if (t.includes("Invalid login") || t.includes("invalid_credentials")) {
          setMsg("Correo o contraseña incorrectos.", "error");
        } else if (t.includes("Email not confirmed")) {
          setMsg("Confirma tu correo antes de iniciar sesión.", "error");
        } else {
          setMsg("Error al iniciar sesión. Intenta de nuevo.", "error");
        }
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });

    // ── Magic Link ────────────────────────────────────────────────────────────
    document.getElementById("btnMagic").addEventListener("click", async () => {
      const email = document.getElementById("magicEmail").value.trim();
      const btn   = document.getElementById("btnMagic");

      if (!email) { setMsg("Ingresa tu correo electrónico.", "error"); return; }

      btn.disabled = true;
      btn.textContent = "Enviando...";
      setMsg("", "");

      try {
        await loginWithMagicLink(email);
        setMsg("¡Enlace enviado! Revisa tu correo (y la carpeta de spam).", "ok");
        btn.textContent = "Enlace enviado ✓";
      } catch (err) {
        setMsg("Error al enviar el enlace. Intenta de nuevo.", "error");
        btn.disabled = false;
        btn.textContent = "Enviar enlace mágico";
      }
    });

    // ── Google OAuth ──────────────────────────────────────────────────────────
    document.getElementById("btnGoogle").addEventListener("click", async () => {
      try {
        await loginWithGoogle();
      } catch (err) {
        setMsg("Error al conectar con Google. Intenta de nuevo.", "error");
      }
    });

    // ── Olvidé mi contraseña ──────────────────────────────────────────────────
    document.getElementById("btnForgot").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("formPassword").style.display = "none";
      document.getElementById("formForgot").style.display = "";
      // Pre-llenar el email si ya lo escribió
      const emailVal = document.getElementById("email").value.trim();
      if (emailVal) document.getElementById("forgotEmail").value = emailVal;
      setMsg("", "");
    });

    document.getElementById("btnBackLogin").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("formForgot").style.display = "none";
      document.getElementById("formPassword").style.display = "";
      setMsg("", "");
    });

    document.getElementById("btnSendReset").addEventListener("click", async () => {
      const email = document.getElementById("forgotEmail").value.trim();
      const btn   = document.getElementById("btnSendReset");

      if (!email) { setMsg("Ingresa tu correo electrónico.", "error"); return; }

      btn.disabled = true;
      btn.textContent = "Enviando...";
      setMsg("", "");

      try {
        const res = await fetch(`${BACKEND_URL}/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        if (!res.ok) throw new Error("Error del servidor");
        setMsg("¡Enlace enviado! Revisa tu correo (y la carpeta de spam).", "ok");
        btn.textContent = "Enviado ✓";
      } catch (err) {
        setMsg("Error al enviar el enlace. Verifica el correo e intenta de nuevo.", "error");
        btn.disabled = false;
        btn.textContent = "Enviar enlace de recuperación";
      }
    });
  </script>
<script src="soporte-widget.js"></script>
</body>
</html>
