</head>
<body>
  <header class="cat-header">
    <img src="img/ECM%20blanco%20sin%20fondo.png" alt="CEECM">
    <div class="cat-header-actions" id="headerActions">
      <a href="login.html">Iniciar sesión</a>
      <a href="pago.html">Obtener acceso</a>
    </div>
  </header>

  <main class="cat-main">
    <h1 class="cat-title">Catálogo de Cursos</h1>
    <p class="cat-subtitle">Explora nuestra oferta de capacitación y certificación.</p>

    <div class="cursos-grid" id="cursosGrid">
      <div class="cat-loading">Cargando cursos...</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const BACKEND_URL = "https://ceecmweb.onrender.com";
    let sesionActual = null;
    let inscripcionesUsuario = new Set();

    async function inicializar() {
      sesionActual = await getSession();

      // Actualizar header según estado de sesión
      const headerActions = document.getElementById("headerActions");
      if (sesionActual) {
        const meta = sesionActual.user?.user_metadata || {};
        const nombre = meta.nombre || sesionActual.user.email;
        const rol = meta.rol || "estudiante";
        headerActions.innerHTML = `
          <span style="color:rgba(255,255,255,0.85);font-size:14px;">${nombre}</span>
          ${rol === "instructor" || rol === "admin" ? '<a href="index.html">Wizard</a>' : ''}
          <a href="dashboard.html">Mi cuenta</a>
          <button onclick="logout()">Salir</button>
        `;
        await cargarInscripciones();
      }

      await cargarCursos();
    }

    async function cargarInscripciones() {
      if (!sesionActual) return;
      try {
        const headers = await getAuthHeaders();
        const res = await fetch(`${BACKEND_URL}/inscripciones/mias`, { headers });
        if (!res.ok) return;
        const data = await res.json();
        data.forEach(i => inscripcionesUsuario.add(i.curso_id));
      } catch (_) {}
    }

    async function cargarCursos() {
      const grid = document.getElementById("cursosGrid");
      try {
        const res = await fetch(`${BACKEND_URL}/cursos`);
        if (!res.ok) throw new Error("Error al cargar cursos");
        const cursos = await res.json();

        if (!cursos.length) {
          grid.innerHTML = '<div class="cat-empty">No hay cursos disponibles por el momento.</div>';
          return;
        }

        grid.innerHTML = cursos.map(c => renderCurso(c)).join("");
      } catch (err) {
        grid.innerHTML = `<div class="cat-error">Error al cargar los cursos. Intenta de nuevo más tarde.</div>`;
      }
    }

    function renderCurso(c) {
      const instructor = c.profiles ? `${c.profiles.nombre || ""} ${c.profiles.apellido || ""}`.trim() : "";
      const precioStr = c.precio === 0 ? "Gratis" : `$${Number(c.precio).toLocaleString("es-MX")} MXN`;
      const esGratis = c.precio === 0;
      const yaInscrito = inscripcionesUsuario.has(c.id);

      const imgHTML = c.imagen_url
        ? `<div class="curso-img"><img src="${c.imagen_url}" alt="${c.titulo}"></div>`
        : `<div class="curso-img">📚</div>`;

      let btnHTML;
      if (yaInscrito) {
        btnHTML = `<button class="btn-comprar inscrito" disabled>Inscrito</button>`;
      } else if (!sesionActual) {
        btnHTML = `<button class="btn-comprar" onclick="window.location.href='login.html'">Comprar</button>`;
      } else if (esGratis) {
        btnHTML = `<button class="btn-comprar" onclick="inscribirseGratis('${c.id}', this)">Inscribirse</button>`;
      } else {
        btnHTML = `<button class="btn-comprar" onclick="comprar('${c.id}', this)">Comprar</button>`;
      }

      return `
        <div class="curso-card">
          ${imgHTML}
          <div class="curso-body">
            <div class="curso-titulo">${c.titulo}</div>
            <div class="curso-desc">${c.descripcion || ""}</div>
            <div class="curso-meta">
              ${c.duracion_horas ? `<span>⏱ ${c.duracion_horas}h</span>` : ""}
            </div>
            ${instructor ? `<div class="curso-instructor">Instructor: ${instructor}</div>` : ""}
          </div>
          <div class="curso-footer">
            <span class="curso-precio ${esGratis ? 'gratis' : ''}">${precioStr}</span>
            ${btnHTML}
          </div>
        </div>
      `;
    }

    async function comprar(cursoId, btn) {
      btn.disabled = true;
      btn.textContent = "Procesando...";
      try {
        const headers = await getAuthHeaders();
        const res = await fetch(`${BACKEND_URL}/checkout/session`, {
          method: "POST",
          headers,
          body: JSON.stringify({
            curso_id: cursoId,
            success_url: `${window.location.origin}/diseno/checkout-success.html?session_id={CHECKOUT_SESSION_ID}`,
            cancel_url: window.location.href
          })
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Error al iniciar el pago");
        }
        const data = await res.json();
        window.location.href = data.checkout_url;
      } catch (err) {
        alert(err.message || "Error al procesar el pago. Intenta de nuevo.");
        btn.disabled = false;
        btn.textContent = "Comprar";
      }
    }

    async function inscribirseGratis(cursoId, btn) {
      btn.disabled = true;
      btn.textContent = "Inscribiendo...";
      try {
        const headers = await getAuthHeaders();
        await fetch(`${BACKEND_URL}/inscripciones/gratis`, {
          method: "POST",
          headers,
          body: JSON.stringify({ curso_id: cursoId })
        });
        btn.textContent = "Inscrito";
        btn.className = "btn-comprar inscrito";
        inscripcionesUsuario.add(cursoId);
      } catch (_) {
        btn.disabled = false;
        btn.textContent = "Inscribirse";
      }
    }

    inicializar();
  </script>
</body>
</html> -->
