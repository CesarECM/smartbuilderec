<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBuilder EC — EC0091 Verificación Externa</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="ec0091.css">
</head>
<body>

  <nav id="wiz-nav">
    <a href="panel" class="wiz-nav-back" id="wizNavBack">← Mi Panel</a>
    <span id="wiz-nav-curso" class="wiz-nav-curso"></span>
    <div class="wiz-nav-user">
      <span id="wiz-nav-nombre"></span>
      <button class="wiz-nav-logout" onclick="logout()">Salir</button>
    </div>
  </nav>

  <button id="btnFocusExit" title="Mostrar sidebar (Esc)">▶ SIDEBAR</button>

  <button class="menu-toggle" id="menuToggle">
    <i class="fa fa-bars"></i>
  </button>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div id="progress-bar-container">
        <div id="progress-bar-inner">
          <span id="progress-step-label">Paso 1 — Datos de la verificación</span>
          <div id="progress-track"><div id="progress-fill"></div></div>
          <span id="progress-pct">0%</span>
        </div>
      </div>

      <div id="celebration-overlay">
        <div class="celebration-icon">🎉</div>
        <div class="celebration-title">¡Expediente generado!</div>
        <div class="celebration-sub">Tu ZIP con los documentos se está descargando.</div>
        <div class="celebration-bar"><div class="celebration-bar-fill"></div></div>
      </div>

      <div id="toast-container"></div>
    </main>
  </div>

  <script src="panel/branding-engine.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script src="storage/core.js"></script>
  <script src="shared/modals.js"></script>
  <script src="shared/utils.js"></script>
  <script src="shared/events.js"></script>
  <script src="shared/speed-dial.js"></script>
  <script src="wizard-ec0091/sync.js"></script>
  <script type="module" src="wizard-ec0091/main.js"></script>

  <script src="soporte/widget-main.js"></script>
  <script src="soporte/widget-ui.js"></script>
  <script src="soporte/widget-chat.js"></script>
  <script src="soporte/widget-tickets.js"></script>
</body>
</html>
